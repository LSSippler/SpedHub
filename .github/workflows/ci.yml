name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatierung prüfen
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Lkw einsetzen und mit Erwartung vergleichen
        run: |
          python3 tools/transplant.py testdata/quelle_mit_lkw.sii testdata/ziel_schnellauftrag.sii "$RUNNER_TEMP/ergebnis.sii"
          cmp "$RUNNER_TEMP/ergebnis.sii" testdata/erwartet_nach_einsetzen.sii

      # Derselbe Build wie im Release: Server für den VPS, statisch mit musl gelinkt
      - name: musl-Werkzeuge installieren
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Server für Linux bauen (musl, statisch)
        run: |
          cargo build --release --locked -p spedhub-server --target x86_64-unknown-linux-musl
          BIN=target/x86_64-unknown-linux-musl/release/spedhub-server
          file "$BIN"
          file "$BIN" | grep -Eq 'statically linked|static-pie linked'
          ldd "$BIN" > ldd.txt 2>&1 || true
          cat ldd.txt
          if grep -q '=>' ldd.txt; then echo "::error::spedhub-server ist dynamisch gelinkt"; exit 1; fi
          "$BIN" --version
          mkdir -p dist-linux
          cp "$BIN" dist-linux/spedhub-server-linux-x86_64
          (cd dist-linux && sha256sum spedhub-server-linux-x86_64 > spedhub-server-linux-x86_64.sha256)

      - name: Server für Linux hochladen
        uses: actions/upload-artifact@v6
        with:
          name: spedhub-server-linux-x86_64
          path: dist-linux/
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Plugin-DLL bauen
        shell: pwsh
        run: |
          cargo build --release -p spedhub-plugin
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/spedhub_plugin.dll, crates/spedhub-plugin/README.md dist/

      - name: Plugin-DLL hochladen
        uses: actions/upload-artifact@v6
        with:
          name: spedhub-plugin-windows-x64
          path: dist/
          if-no-files-found: error

      - name: Launcher bauen
        shell: pwsh
        run: |
          cargo build --release -p spedhub-launcher
          New-Item -ItemType Directory -Force dist-launcher | Out-Null
          Copy-Item target/release/spedhub-launcher.exe, crates/spedhub-launcher/README.md dist-launcher/

      - name: Launcher hochladen
        uses: actions/upload-artifact@v6
        with:
          name: spedhub-launcher-windows-x64
          path: dist-launcher/
          if-no-files-found: error

      # Kommandozeile für Spielstände und die Wirtschafts-Mod (economy-mod)
      - name: spedhub-save bauen
        shell: pwsh
        run: |
          cargo build --release -p spedhub-save
          New-Item -ItemType Directory -Force dist-save | Out-Null
          Copy-Item target/release/spedhub-save.exe, tools/README.md, docs/wirtschafts-mod.md dist-save/
          ./dist-save/spedhub-save.exe help

      - name: spedhub-save hochladen
        uses: actions/upload-artifact@v6
        with:
          name: spedhub-save-windows-x64
          path: dist-save/
          if-no-files-found: error

      - name: Setup bauen
        shell: pwsh
        run: ./installer/build.ps1 -OutDir dist-setup

      - name: Setup hochladen
        uses: actions/upload-artifact@v6
        with:
          name: spedhub-setup-windows-x64
          path: dist-setup/
          if-no-files-found: error
