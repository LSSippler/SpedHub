name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatierung prüfen
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Lkw einsetzen und mit Erwartung vergleichen
        run: |
          python3 tools/transplant.py testdata/quelle_mit_lkw.sii testdata/ziel_schnellauftrag.sii "$RUNNER_TEMP/ergebnis.sii"
          cmp "$RUNNER_TEMP/ergebnis.sii" testdata/erwartet_nach_einsetzen.sii

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Plugin-DLL bauen
        shell: pwsh
        run: |
          cargo build --release -p spedhub-plugin
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/spedhub_plugin.dll, crates/spedhub-plugin/README.md dist/

      - name: Plugin-DLL hochladen
        uses: actions/upload-artifact@v5
        with:
          name: spedhub-plugin-windows-x64
          path: dist/
          if-no-files-found: error
