<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpedHub</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --hof: #e3e6e4;       /* Betonhof: Seitenhintergrund */
    --papier: #fbfbf8;    /* Formulare, Flächen */
    --plane: #1e2a32;     /* Text */
    --blass: #5c6870;     /* Nebentext */
    --eu: #0b3d91;        /* Kennzeichenblau: Aktionen */
    --frei: #1f7a4d;
    --weg: #9a5b00;
    --fehler: #a4262c;
    --buch: #edf3e6;      /* Kassenbuchpapier */
    --linie: #bfd0b4;
    --rand: #b9bfbc;
    --schrift: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-size: 100%; }
  body {
    margin: 0; background: var(--hof); color: var(--plane);
    font-family: var(--schrift); font-size: 1rem; line-height: 1.45;
    font-variant-numeric: tabular-nums;
  }
  h1, h2, h3 { font-stretch: 80%; line-height: 1.15; margin: 0; }
  h1 { font-size: 1.95rem; font-weight: 700; }
  h2 { font-size: 1.56rem; font-weight: 600; margin-bottom: .75rem; }
  h3 { font-size: 1.125rem; font-weight: 600; margin-bottom: .5rem; }
  p { margin: 0 0 .75rem; max-width: 62ch; }
  .blass { color: var(--blass); }
  .klein { font-size: .875rem; }

  .kopf {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1.5rem;
    padding: 1.25rem clamp(1rem, 4vw, 2.5rem) 1rem; border-bottom: 2px solid var(--plane);
  }
  .kopf .wer { margin-left: auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1rem; }
  main { padding: 1.5rem clamp(1rem, 4vw, 2.5rem) 4rem; }

  /* Formulare */
  label { display: block; font-size: .875rem; color: var(--blass); margin-bottom: .2rem; }
  input, select {
    font: inherit; color: inherit; width: 100%; padding: .5rem .6rem;
    background: #fff; border: 1px solid var(--rand); border-radius: 3px;
  }
  .feld { margin-bottom: .75rem; }
  .zeile { display: flex; flex-wrap: wrap; gap: .75rem; align-items: flex-end; }
  .zeile > .feld { flex: 1 1 9rem; margin-bottom: 0; }
  .zeile > .feld.breit { flex: 2 1 17rem; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; padding: .5rem .9rem; white-space: nowrap;
    background: var(--eu); color: #fff; border: 1px solid var(--eu); border-radius: 3px;
  }
  button:hover { background: #082d6c; }
  button.leise { background: transparent; color: var(--eu); border-color: var(--rand); }
  button.leise:hover { background: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid #f2b100; outline-offset: 2px; }

  .blatt { background: var(--papier); border: 1px solid var(--rand); padding: 1.25rem; }
  .schmal { max-width: 26rem; }
  .stapel > * + * { margin-top: 2.25rem; }
  .paar { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1.25rem; }

  /* Firmenansicht */
  .firma { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(21rem, 1fr); gap: 2.5rem; align-items: start; }
  @media (max-width: 62rem) {
    .firma { grid-template-columns: minmax(0, 1fr); }
    /* Schmal: Kassenstand zuerst, das Journal bleibt kurz und rollt in sich. */
    .firma > .buch { order: -1; position: static; max-height: none; }
    .firma > .buch .eintraege { max-height: 15rem; }
  }

  /* Fuhrpark: jeder Lkw ist sein Kennzeichen */
  .lkw { display: grid; grid-template-columns: 11.5rem minmax(0, 1fr) auto; gap: .25rem 1.25rem; align-items: center;
         padding: .85rem 0; border-top: 1px solid var(--rand); }
  .lkw:last-child { border-bottom: 1px solid var(--rand); }
  .kz { display: inline-flex; align-items: stretch; background: #fff; border: 2px solid #14181b; border-radius: 6px;
        font-stretch: 75%; font-weight: 700; font-size: 1.5rem; letter-spacing: .05em; line-height: 1; white-space: nowrap; }
  .kz::before { content: "D"; display: flex; align-items: flex-end; justify-content: center; width: 1.15rem;
                padding-bottom: .22rem; background: var(--eu); color: #fff; font-size: .7rem; letter-spacing: 0;
                border-radius: 3px 0 0 3px; }
  .kz span { padding: .4rem .65rem .34rem; }
  .lkw .modell { font-weight: 600; }
  .stand { font-weight: 600; }
  .stand.frei { color: var(--frei); }
  .stand.weg { color: var(--weg); }
  .stand.werkstatt { color: var(--fehler); }
  .schaden.hoch { color: var(--fehler); font-weight: 600; }
  .knoepfe { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: flex-end; }
  .rueckgabe { grid-column: 1 / -1; background: var(--papier); border: 1px solid var(--rand); padding: .75rem; margin-top: .5rem; }
  @media (max-width: 34rem) { .lkw { grid-template-columns: minmax(0, 1fr); } .knoepfe { justify-content: flex-start; } }

  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .45rem .75rem .45rem 0; border-bottom: 1px solid var(--rand); }
  th { font-size: .875rem; font-weight: 400; color: var(--blass); }
  .zahl { text-align: right; white-space: nowrap; padding-right: 0; }
  .minus { color: var(--fehler); }

  /* Kassenbuch: liniertes Papier mit zwei Betragsspalten */
  .buch { background: var(--buch); border: 1px solid var(--linie); position: sticky; top: 1rem;
          display: flex; flex-direction: column; max-height: calc(100vh - 2rem); }
  .buch header { padding: 1rem 1rem .75rem; border-bottom: 2px solid var(--plane); }
  .bestand { font-size: 2.44rem; font-weight: 700; font-stretch: 80%; line-height: 1.1; }
  .buch table { font-size: .9375rem; }
  .buch th, .buch td { border-bottom: 1px solid var(--linie); padding: .4rem .6rem; vertical-align: top; }
  .buch th.zahl, .buch td.zahl { border-left: 1px solid var(--linie); width: 6.25rem; }
  .buch .wann { color: var(--blass); white-space: nowrap; width: 5.25rem; }
  .eintraege { overflow: auto; min-height: 0; }

  .buch tr.lauf td { font-weight: 600; }
  .buch tr.lauf button { padding: 0; border: 0; background: none; color: var(--eu); font-weight: 600; text-align: left; white-space: normal; }
  .buch tr.lauf button::before { content: "\25B8\00A0"; }
  .buch tr.lauf button[aria-expanded="true"]::before { content: "\25BE\00A0"; }
  .buch td.innen { padding: 0 .6rem .6rem 1.4rem; }
  .buch td.innen table { font-size: .875rem; }
  .buch td.innen th, .buch td.innen td { border-left: 0; width: auto; padding: .25rem .5rem .25rem 0; }
  .ungeklaert { padding: .75rem 1rem; border-bottom: 1px solid var(--linie); background: #fff6e5; }
  .ungeklaert h3 { color: var(--weg); }
  .ungeklaert ul { list-style: none; margin: 0; padding: 0; }
  .ungeklaert li { display: flex; flex-wrap: wrap; gap: .25rem .75rem; align-items: baseline; padding: .3rem 0; }
  .ungeklaert li button { padding: .2rem .6rem; }
  .stufen td { padding-right: .5rem; }
  .stufen input { padding: .35rem .45rem; min-width: 4.5rem; }
  .ganz { grid-column: 1 / -1; }
  #fahrer th, #fahrer td { padding-right: .75rem; }
  .buch td.innen .klein { font-weight: 400; }
  .code { font-size: 1.56rem; font-weight: 700; letter-spacing: .12em; }
  details > summary { cursor: pointer; font-weight: 600; font-stretch: 80%; font-size: 1.125rem; }
  details[open] > summary { margin-bottom: .75rem; }

  /* Online-Punkt bei den Fahrern */
  .punkt { display: inline-block; width: .65rem; height: .65rem; border-radius: 50%; background: var(--rand);
           margin-right: .4rem; vertical-align: baseline; }
  .punkt.an { background: var(--frei); }
  .fremd { color: var(--weg); font-weight: 600; }
  .faehrt { color: var(--frei); font-weight: 600; }
  #fahrer td { vertical-align: top; }
  .unterwegs { min-width: 12rem; }
  .wer-name { white-space: nowrap; }

  dialog { border: 1px solid var(--rand); padding: 1.25rem; max-width: min(26rem, calc(100vw - 2rem)); background: var(--papier); color: inherit; }
  dialog::backdrop { background: rgba(30, 42, 50, .35); }
  dialog .fehlertext { color: var(--fehler); }

  /* Ausgemustert und verkauft: eingeklappt unter dem Fuhrpark */
  .abgaenge { margin-top: 1.25rem; }
  .abgaenge .lkw { opacity: .8; }
  .abgaenge .kz { font-size: 1.15rem; }
  .stand.raus { color: var(--blass); }
  /* Kleine Knöpfe im Kassenbuch */
  .buch td button.mini { padding: .15rem .5rem; font-size: .8125rem; font-weight: 600; white-space: normal; text-align: left; margin-top: .25rem; }
  .buch td .verknuepfen { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .35rem; }
  .buch td .verknuepfen select { width: auto; max-width: 100%; padding: .2rem .35rem; font-size: .875rem; }
  .budget-stand { margin-bottom: .75rem; }
  .budget-stand .rest { font-size: 1.56rem; font-weight: 700; font-stretch: 80%; }

  /* Kassenbuch: Zeitraum, Auswahl und Storno */
  .buch .filter { display: flex; flex-wrap: wrap; gap: .5rem; align-items: flex-end; padding: .6rem 1rem; border-bottom: 1px solid var(--linie); }
  .buch .filter .feld { flex: 1 1 7.5rem; min-width: 0; margin-bottom: 0; }
  .buch .filter input { padding: .3rem .4rem; min-width: 0; }
  .buch .filter button { padding: .3rem .7rem; }
  .buch .auswahl { display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; padding: .6rem 1rem; border-bottom: 1px solid var(--linie); background: #f6f9f1; }
  .buch .auswahl .zaehler { font-weight: 600; margin-right: auto; }
  .buch .auswahl button { padding: .25rem .6rem; font-size: .875rem; white-space: normal; }
  .buch .auswahl p { flex-basis: 100%; margin: 0; }
  .buch .bereich { padding: .5rem 1rem 0; margin: 0; }
  input.wahl { width: auto; margin: 0 .35rem 0 0; vertical-align: -.1rem; accent-color: var(--eu); }
  /* Kästchen über der Uhrzeit, damit die Spalte auch auf dem Telefon schmal bleibt */
  .buch td.wann label { display: flex; flex-direction: column; align-items: flex-start; gap: .15rem;
                        font-size: inherit; color: inherit; margin: 0; cursor: pointer; }
  /* Feste Spalten: "Was" bekommt den Rest, lange Wörter dürfen dort umbrechen. Sonst schiebt die
     Spalte auf dem Telefon das Lohnkonto aus dem Bild. */
  #buch-liste > table { table-layout: fixed; }
  #buch-liste > table > thead th.wann { width: 5.25rem; }
  .buch td:not(.zahl) { overflow-wrap: break-word; }
  @media (max-width: 34rem) {
    #buch-liste > table > thead th.wann { width: 4.5rem; }
    #buch-liste > table > thead th.zahl { width: 5.6rem; }
  }
  .buch tr.storniert .durch { text-decoration: line-through; color: var(--blass); }
  .buch .storno-hinweis { color: var(--weg); font-size: .8125rem; }
  .buch tr.storno td { background: #f7f1e6; }
  dialog .warnung { color: var(--weg); }

  #meldung { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); max-width: min(34rem, 92vw);
             padding: .7rem 1rem; background: var(--plane); color: #fff; border-radius: 3px; }
  #meldung.fehler { background: var(--fehler); }
  #meldung:empty { display: none; }
</style>
</head>
<body>
<header class="kopf">
  <h1 id="titel">SpedHub</h1>
  <div class="wer" id="wer"></div>
</header>
<main id="app"></main>
<div id="meldung" role="status" aria-live="polite"></div>

<script>
"use strict";

// ---------------------------------------------------------------- Grundlagen

const $ = (id) => document.getElementById(id);

/** Baut ein Element. Texte landen immer als Text im Dokument, nie als HTML. */
function h(tag, attrs, ...kinder) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") { el.setAttribute("value", v); el.value = v; }
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kind of kinder.flat()) {
    if (kind == null || kind === false) continue;
    el.append(kind.nodeType ? kind : document.createTextNode(String(kind)));
  }
  return el;
}

const speicher = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

const zustand = { token: speicher.get("token"), ich: null, firmaId: null, firma: null, lkw: [], buch: null, rueckgabe: null,
                  laeufe: [], ungeklaert: [], abgelehnt: [], offen: new Set(),
                  // Verkaufen oder ausmustern: { id, art: "verkauf" | "ausmustern" }
                  abgang: null, abgaengeOffen: false,
                  // Kennzeichen ändern: id des Lkw. Vorschlag des Servers für den nächsten Lkw (nur Chef)
                  umbenennen: null, vorschlag: null,
                  // Kassenbuch: Buchung, die gerade als Lkw-Kauf verknüpft wird
                  verknuepfen: null,
                  // Kassenbuch: Zeitraum (lokale Tage wie "2026-11-16", leer heißt offen) und
                  // ausgewählte Buchungen zum Stornieren: id -> { amount, account, kind }
                  filter: { von: "", bis: "" }, auswahl: new Map(), sichtbar: [], buchStand: null };
let takt = null;

class ApiFehler extends Error { constructor(status, text) { super(text); this.status = status; } }

async function api(methode, pfad, daten) {
  const kopf = {};
  if (zustand.token) kopf.Authorization = "Bearer " + zustand.token;
  if (daten !== undefined) kopf["Content-Type"] = "application/json";
  let antwort;
  try {
    antwort = await fetch(pfad, { method: methode, headers: kopf, body: daten === undefined ? undefined : JSON.stringify(daten) });
  } catch {
    throw new ApiFehler(0, "Der Server antwortet nicht. Läuft er noch?");
  }
  const json = await antwort.json().catch(() => null);
  if (!antwort.ok) throw new ApiFehler(antwort.status, (json && json.error) || "Die Anfrage ist fehlgeschlagen (" + antwort.status + ")");
  return json;
}

let meldungUhr = null;
function melde(text, fehler) {
  const m = $("meldung");
  m.textContent = text;
  m.className = fehler ? "fehler" : "";
  clearTimeout(meldungUhr);
  meldungUhr = setTimeout(() => { m.textContent = ""; }, fehler ? 8000 : 4000);
}

/** Führt eine Aktion aus und zeigt Fehler an. Bei abgelaufener Anmeldung geht es zurück zum Anmelden. */
async function versuche(aktion, knopf) {
  if (knopf) knopf.disabled = true;
  try {
    await aktion();
  } catch (e) {
    if (e instanceof ApiFehler && e.status === 401 && zustand.token) {
      abmeldenLokal();
      melde("Deine Anmeldung ist abgelaufen. Melde dich neu an.", true);
    } else {
      melde(e.message || String(e), true);
    }
  } finally {
    if (knopf) knopf.disabled = false;
  }
}

const euro = (n) => new Intl.NumberFormat("de-DE").format(n) + "\u00a0€";
const km = (n) => new Intl.NumberFormat("de-DE").format(n) + "\u00a0km";
const uhrzeit = (s) => new Date(s * 1000).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const datum = (s) => new Date(s * 1000).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
function wann(s) {
  const d = new Date(s * 1000);
  const heute = new Date().toDateString() === d.toDateString();
  return heute ? uhrzeit(s) : d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + " " + uhrzeit(s);
}
/** "scania.s_2016" wird zu "Scania S 2016", "volvo.fh_2024" zu "Volvo FH 2024". */
const modellName = (m) => m.split(/[._]/).filter(Boolean)
  .map((w) => (w.length <= 3 ? w.toUpperCase() : w[0].toUpperCase() + w.slice(1))).join(" ");

/** Ereignisarten, wie das Plugin sie meldet. */
const ARTEN_SPIEL = { job_delivered: "Auftrag abgeliefert", job_cancelled: "Auftrag abgebrochen", fined: "Strafe",
                      tollgate: "Maut", ferry: "Fähre", train: "Zug" };
const ARTEN = { lohn: "Lohnanteil (altes Modell)", auftrag: "Auftrag", strafe: "Strafe", maut: "Maut", faehre: "Fähre", zug: "Zug",
                auftrag_abgebrochen: "Auftrag abgebrochen", ueberweisung: "Überweisung", betriebskosten: "Betriebskosten",
                betriebskosten_korrektur: "Betriebskosten, Korrektur", werkstatt: "Werkstatt", haftung: "Haftung",
                lkw_verkauf: "Lkw-Verkauf", storno: "Storno" };
/** Art des Originals bei einem Storno. Ein Storno von Lohn kommt fast immer aus einer Lohnabrechnung. */
const ARTEN_STORNO = { ...ARTEN, lohn: "Lohn" };
/** "2026-11-16" wird zu "16.11.2026". */
const tag = (d) => d.split("-").reverse().join(".");
const cent = (n) => new Intl.NumberFormat("de-DE").format(n) + "\u00a0ct";
/** Schaden mit höchstens einer Nachkommastelle: 12,5 %. */
const zehntel = (n) => new Intl.NumberFormat("de-DE", { maximumFractionDigits: 1 }).format(n);
const prozent = (n) => zehntel(n) + "\u00a0%";

function feld(beschriftung, eingabe, klasse) {
  if (!eingabe.id) eingabe.id = "f" + Math.random().toString(36).slice(2, 9);
  return h("div", { class: "feld" + (klasse ? " " + klasse : "") }, h("label", { for: eingabe.id }, beschriftung), eingabe);
}

function formular(beimSenden, ...inhalt) {
  return h("form", { onsubmit: (e) => { e.preventDefault(); versuche(() => beimSenden(e.target), e.submitter); } }, ...inhalt);
}

// ---------------------------------------------------------------- Kopfzeile

function zeigeKopf() {
  $("titel").textContent = zustand.firma ? zustand.firma.name : "SpedHub";
  document.title = zustand.firma ? zustand.firma.name + ", SpedHub" : "SpedHub";
  const wer = $("wer");
  wer.replaceChildren();
  if (!zustand.ich) return;
  const rolle = zustand.firma ? (zustand.firma.your_role === "chef" ? "Chef" : "Fahrer") : null;
  wer.append(h("span", {}, zustand.ich.name, rolle ? ", " + rolle : ""));
  if (zustand.firma) wer.append(h("button", { class: "leise", onclick: () => versuche(zeigeFirmenwahl) }, "Firma wechseln"));
  wer.append(h("button", { class: "leise", onclick: zeigePasswort }, "Passwort ändern"));
  wer.append(h("button", { class: "leise", onclick: (e) => versuche(abmelden, e.target) }, "Abmelden"));
}

/** Kleiner Dialog zum Ändern des Passworts. Danach sind alle anderen Anmeldungen ungültig. */
function zeigePasswort() {
  const alt = h("input", { type: "password", required: true, autocomplete: "current-password" });
  const neu = h("input", { type: "password", required: true, minlength: 8, autocomplete: "new-password" });
  const nochmal = h("input", { type: "password", required: true, minlength: 8, autocomplete: "new-password" });
  const fehler = h("p", { class: "fehlertext klein", role: "alert" });
  const dialog = h("dialog", { "aria-labelledby": "pwtitel" });
  const zu = () => { dialog.close(); dialog.remove(); };
  const senden = async (e) => {
    e.preventDefault();
    fehler.textContent = "";
    if (neu.value !== nochmal.value) { fehler.textContent = "Die Wiederholung passt nicht zum neuen Passwort."; return; }
    const knopf = e.submitter;
    if (knopf) knopf.disabled = true;
    try {
      await api("POST", "/api/me/password", { old_password: alt.value, new_password: neu.value });
      zu();
      melde("Passwort geändert. Alle anderen Anmeldungen mit diesem Konto sind abgemeldet, auch Launcher und Plugin. Hier bleibst du angemeldet.");
    } catch (err) {
      if (err instanceof ApiFehler && err.status === 401) { zu(); abmeldenLokal(); melde("Deine Anmeldung ist abgelaufen. Melde dich neu an.", true); }
      else fehler.textContent = err.message || String(err);
    } finally {
      if (knopf) knopf.disabled = false;
    }
  };
  dialog.append(
    h("h2", { id: "pwtitel" }, "Passwort ändern"),
    h("p", { class: "klein blass" }, "Danach sind alle anderen Anmeldungen mit diesem Konto abgemeldet, auch Launcher und Plugin auf diesem und anderen Rechnern. Melde dich danach im Launcher neu an und starte das Spiel neu."),
    h("form", { onsubmit: senden },
      feld("Altes Passwort", alt),
      feld("Neues Passwort, mindestens 8 Zeichen", neu),
      feld("Neues Passwort wiederholen", nochmal),
      fehler,
      h("div", { class: "zeile" },
        h("button", {}, "Passwort ändern"),
        h("button", { type: "button", class: "leise", onclick: zu }, "Abbrechen"))));
  dialog.addEventListener("cancel", () => setTimeout(() => dialog.remove(), 0));
  document.body.append(dialog);
  dialog.showModal();
  alt.focus();
}

// ---------------------------------------------------------------- Anmelden

function abmeldenLokal() {
  clearInterval(takt);
  zustand.token = null; zustand.ich = null; zustand.firma = null; zustand.firmaId = null;
  speicher.set("token", null); speicher.set("firma", null);
  zeigeAnmeldung(false);
}

async function abmelden() {
  try { await api("POST", "/api/logout"); } catch {}
  abmeldenLokal();
}

function zeigeAnmeldung(neu) {
  zeigeKopf();
  const name = h("input", { autocomplete: "username", required: true, minlength: 3, maxlength: 32 });
  const passwort = h("input", { type: "password", required: true, minlength: 8, autocomplete: neu ? "new-password" : "current-password" });
  const senden = async () => {
    const r = await api("POST", neu ? "/api/register" : "/api/login", { name: name.value, password: passwort.value });
    zustand.token = r.token;
    speicher.set("token", r.token);
    await start();
  };
  $("app").replaceChildren(h("div", { class: "blatt schmal" },
    h("h2", {}, neu ? "Konto anlegen" : "Anmelden"),
    formular(senden,
      feld("Name", name),

        h("button", {}, neu ? "Konto anlegen" : "Anmelden"),
        h("button", { type: "button", class: "leise", onclick: () => zeigeAnmeldung(!neu) },
          neu ? "Ich habe schon ein Konto" : "Neues Konto anlegen")))));
  name.focus();
}

// ---------------------------------------------------------------- Firma

/** Beginn eines lokalen Tags wie "2026-11-16" in Unix-Sekunden, mit `plus` Tagen später. */
function tagBeginn(tagText, plus) {
  const [y, m, d] = tagText.split("-").map(Number);
  return Math.floor(new Date(y, m - 1, d + (plus || 0)).getTime() / 1000);
}

/** Zeitraum des Kassenbuchs als Teil der Adresse: von Mitternacht bis Mitternacht nach "bis". */
function bereichAnfrage() {
  const f = zustand.filter;
  let q = "";
  if (f.von) q += "&from=" + tagBeginn(f.von);
  if (f.bis) q += "&to=" + tagBeginn(f.bis, 1);
  return q;
}

/** So viele Buchungen holt das Kassenbuch höchstens, mit Zeitraum mehr. */
const buchGrenze = () => (bereichAnfrage() ? 500 : 200);

async function ladeFirma() {
  const id = zustand.firmaId;
  const bereich = bereichAnfrage();
  const [firma, lkw, buch, laeufe] = await Promise.all([
    api("GET", "/api/companies/" + id),
    api("GET", "/api/companies/" + id + "/trucks"),
    api("GET", "/api/companies/" + id + "/ledger?limit=" + buchGrenze() + bereich),
    api("GET", "/api/companies/" + id + "/payrolls?limit=60" + bereich),
  ]);
  const chef = firma.your_role === "chef";
  const [ungeklaert, abgelehnt, vorschlag] = chef ? await Promise.all([
    api("GET", "/api/companies/" + id + "/unexplained").then((r) => r.entries),
    api("GET", "/api/companies/" + id + "/rejected-events?limit=50").then((r) => r.entries),
    api("GET", "/api/companies/" + id + "/plate-suggestion").then((r) => r.plate),
  ]) : [[], [], null];
  // Inzwischen eine andere Firma oder ein anderer Zeitraum: Diese Antwort ist veraltet
  if (id !== zustand.firmaId || bereich !== bereichAnfrage()) return;
  zustand.firma = firma; zustand.lkw = lkw.trucks; zustand.buch = buch;
  zustand.laeufe = laeufe.payrolls; zustand.ungeklaert = ungeklaert; zustand.abgelehnt = abgelehnt;
  zustand.vorschlag = vorschlag;
  // Was inzwischen storniert ist, fällt aus der Auswahl
  for (const e of buch.entries) if (!e.reversible) zustand.auswahl.delete(e.id);
  for (const l of laeufe.payrolls) for (const x of l.lines) if (x.reversed_by != null) zustand.auswahl.delete(x.entry_id);
}

async function oeffneFirma(id) {
  clearInterval(takt);
  zustand.firmaId = id; zustand.rueckgabe = null; zustand.abgang = null; zustand.verknuepfen = null;
  zustand.umbenennen = null;
  zustand.auswahl = new Map(); zustand.filter = { von: "", bis: "" }; zustand.buchStand = null;
  await ladeFirma();
  speicher.set("firma", String(id));
  baueFirma();
  takt = setInterval(() => { if (!document.hidden) auffrischen(true); }, 5000);
}

/** Holt neue Daten und zeichnet nur die Teile neu, in denen niemand gerade tippt. */
async function auffrischen(still) {
  try {
    await ladeFirma();
    zeichneDaten();
  } catch (e) {
    if (e instanceof ApiFehler && e.status === 401) { abmeldenLokal(); melde("Deine Anmeldung ist abgelaufen. Melde dich neu an.", true); }
    else if (!still) throw e;
  }
}

function baueFirma() {
  zeigeKopf();
  const chef = zustand.firma.your_role === "chef";
  $("app").replaceChildren(h("div", { class: "firma" },
    h("div", { class: "stapel" },
      h("section", {},
        h("h2", {}, "Fuhrpark"),
        h("p", { class: "blass klein", id: "fuhrpark-hinweis" }),
        h("div", { id: "fuhrpark" })),
      h("section", {}, h("h2", {}, "Fahrer"), h("div", { id: "fahrer" })),
      chef ? baueBuero() : null,
      baueTestbuchung()),
    baueBuch()));
  zeichneDaten();
}

function zeichneDaten() {
  if (!zustand.firma || !$("fuhrpark")) return;
  zeigeKopf();
  // Wo gerade jemand etwas eingibt, wird nicht neu gezeichnet
  if (zustand.rueckgabe == null && zustand.abgang == null && zustand.umbenennen == null) zeichneFuhrpark();
  zeichneFahrer();
  if (zustand.verknuepfen == null) zeichneBuch();
  zeichneBudget();
  zeichneAbgelehnt();
  zeichneMeinProfil();
  fuelleFahrerwahl();
  fuelleKennzeichen();
  fuelleVorschlag();
}

// ---- Fuhrpark

function zeichneFuhrpark() {
  const chef = zustand.firma.your_role === "chef";
  const box = $("fuhrpark");
  $("fuhrpark-hinweis").textContent = "Ausleihen sperrt den Lkw für alle anderen. In den Spielstand schreibt ihn später der Launcher. "
    + "Liegt der Schaden nach der Rückgabe über " + prozent(zustand.firma.damage_limit)
    + ", kommt der Lkw in die Werkstatt und lässt sich erst nach der Reparatur wieder ausleihen.";
  const aktiv = zustand.lkw.filter((t) => !t.retired);
  const raus = zustand.lkw.filter((t) => t.retired);
  const inhalt = [];
  if (!aktiv.length) {
    inhalt.push(h("p", {}, chef
      ? "Noch kein Lkw im Fuhrpark. Leg unten im Büro den ersten an."
      : "Noch kein Lkw im Fuhrpark. Der Chef legt die Lkw an."));
  }
  inhalt.push(...aktiv.map((t) => lkwZeile(t, chef)));
  if (raus.length) {
    // Ausgemustert und verkauft: eingeklappt, nur zum Nachsehen
    const details = h("details", { class: "abgaenge", open: zustand.abgaengeOffen },
      h("summary", {}, "Ausgemustert und verkauft (" + raus.length + ")"),
      h("p", { class: "klein blass" }, "Diese Lkw lassen sich nicht mehr ausleihen. Ihre Buchungen bleiben im Kassenbuch."),
      raus.map(abgangZeile));
    details.addEventListener("toggle", () => { zustand.abgaengeOffen = details.open; });
    inhalt.push(details);
  }
  box.replaceChildren(...inhalt);
}

/** Ein ausgemusterter oder verkaufter Lkw: Grund, Datum, beim Verkauf der Erlös. */
function abgangZeile(t) {
  const r = t.retired;
  const was = r.reason === "verkauft"
    ? "verkauft am " + datum(r.at) + (r.sale_price ? " für " + euro(r.sale_price) : "")
    : "ausgemustert am " + datum(r.at);
  return h("div", { class: "lkw" },
    h("div", {}, h("span", { class: "kz" }, h("span", {}, t.plate))),
    h("div", {},
      h("div", { class: "modell" }, modellName(t.model)),
      h("div", { class: "klein" }, km(t.odometer_km), ", ", h("span", { class: "stand raus" }, was)),
      t.old_plates.length ? h("div", { class: "klein blass" }, "früher " + t.old_plates.join(", ")) : null),
    h("div", {}));
}

function lkwZeile(t, chef) {
  const bei = t.leased_by;
  const meiner = bei && bei.user_id === zustand.ich.user_id;
  const knoepfe = [];
  if (!bei && !t.in_workshop) {
    knoepfe.push(h("button", { onclick: (e) => versuche(async () => {
      await api("POST", "/api/trucks/" + t.id + "/checkout");
      await auffrischen();
      melde(t.plate + " ist jetzt an dich verliehen.");
    }, e.target) }, "Ausleihen"));
  } else if (bei && (meiner || chef)) {
    knoepfe.push(h("button", { class: "leise", onclick: () => { zustand.rueckgabe = t.id; zeichneFuhrpark(); } },
      meiner ? "Zurückgeben" : "Zurücknehmen"));
  }
  // Werkstatt: nur der Chef, nur bei einem Lkw mit Schaden, der gerade nicht verliehen ist
  if (chef && !bei && t.damage > 0) {
    knoepfe.push(h("button", { class: t.in_workshop ? "" : "leise", onclick: (e) => versuche(async () => {
      const r = await api("POST", "/api/trucks/" + t.id + "/repair", {});
      await auffrischen();
      melde(t.plate + " ist repariert" + (r.cost ? ", " + euro(r.cost) + " aus der Firmenkasse" : "") + ". Der Lkw ist wieder frei.");
    }, e.target) }, "Reparieren lassen, " + euro(t.repair_cost)));
  }
  // Kennzeichen ändern, verkaufen und ausmustern: nur der Chef, nur wenn der Lkw nicht verliehen ist
  if (chef && !bei) {
    knoepfe.push(h("button", { class: "leise", onclick: () => { zustand.umbenennen = t.id; zeichneFuhrpark(); } }, "Kennzeichen ändern"));
    for (const [art, text] of [["verkauf", "Verkaufen"], ["ausmustern", "Ausmustern"]]) {
      knoepfe.push(h("button", { class: "leise", onclick: () => { zustand.abgang = { id: t.id, art }; zeichneFuhrpark(); } }, text));
    }
  }
  // Aus dem Herzschlag: der Ausleiher fährt gerade genau diesen Lkw
  const faehrt = t.driving
    ? h("div", { class: "klein faehrt" }, "wird gerade gefahren"
        + (t.speed_kmh != null ? ", " + Math.round(t.speed_kmh) + " km/h" : "")
        + (t.near_city ? ", bei " + t.near_city : ""))
    : null;
  // Nur der Chef sieht, wer einen Lkw fährt, ohne ihn geliehen zu haben
  const fremd = (t.foreign_drivers || []).map((d) =>
    h("div", { class: "klein fremd" }, d.name + " fährt diesen Lkw, ohne ihn geliehen zu haben"));
  // Schaden aus dem Zustand der letzten Rückgabe. Dauerhafter Verschleiß lässt sich nicht reparieren.
  const ueber = t.damage > zustand.firma.damage_limit;
  const schaden = h("div", { class: "klein schaden" + (ueber ? " hoch" : "") },
    "Schaden " + prozent(t.damage) + (t.damage_unfixable > 0 ? ", dauerhaft " + prozent(t.damage_unfixable) : ""));
  const werkstatt = t.in_workshop && !chef
    ? h("div", { class: "klein blass" }, "Ausleihen geht erst wieder, wenn der Chef ihn reparieren lässt.")
    : null;
  const stand = bei
    ? h("span", { class: "stand weg" }, meiner ? "bei dir" : "bei " + bei.name, " seit " + wann(bei.since))
    : t.in_workshop ? h("span", { class: "stand werkstatt" }, "in der Werkstatt")
    : h("span", { class: "stand frei" }, "frei");
  const offen = zustand.rueckgabe === t.id || (zustand.abgang && zustand.abgang.id === t.id) || zustand.umbenennen === t.id;
  const zeile = h("div", { class: "lkw" },
    h("div", {}, h("span", { class: "kz" }, h("span", {}, t.plate))),
    h("div", {},
      h("div", { class: "modell" }, modellName(t.model)),
      h("div", { class: "klein" }, km(t.odometer_km), ", ", stand),
      schaden, werkstatt, faehrt, fremd,
      t.old_plates.length ? h("div", { class: "klein blass" }, "früher " + t.old_plates.join(", ")) : null),
    h("div", { class: "knoepfe" }, offen ? null : knoepfe));
  if (zustand.rueckgabe === t.id) zeile.append(baueRueckgabe(t));
  if (zustand.umbenennen === t.id) zeile.append(baueKennzeichen(t));
  if (zustand.abgang && zustand.abgang.id === t.id) zeile.append(baueAbgang(t, zustand.abgang.art));
  return zeile;
}

/** Kennzeichen ändern (nur Chef), etwa wenn zwei Lkw durch Zufall gleich heißen. */
function baueKennzeichen(t) {
  const neu = h("input", { required: true, maxlength: 16, value: t.plate });
  const zu = () => { zustand.umbenennen = null; zeichneFuhrpark(); };
  setTimeout(() => neu.select(), 0);
  return h("div", { class: "rueckgabe" },
    h("p", { class: "klein" }, "Der Launcher schreibt das neue Kennzeichen beim nächsten Einsetzen in den Spielstand. "
      + "Das alte steht danach bei den früheren Kennzeichen. Erlaubt sind A bis Z, Ziffern, Leerzeichen, Punkt und Bindestrich, höchstens 16 Zeichen."),
    formular(async () => {
        const r = await api("PATCH", "/api/trucks/" + t.id, { plate: neu.value });
        zustand.umbenennen = null;
        await auffrischen();
        melde(r.changed ? t.plate + " heißt jetzt " + r.plate + "." : "Das Kennzeichen bleibt " + r.plate + ".");
      },
      h("div", { class: "zeile" },
        feld("Neues Kennzeichen", neu),
        h("button", {}, "Kennzeichen ändern"),
        h("button", { type: "button", class: "leise", onclick: zu }, "Abbrechen"))));
}

/** Verkaufen (mit Erlös) oder ausmustern (mit Bestätigung). */
function baueAbgang(t, art) {
  const zu = () => { zustand.abgang = null; zeichneFuhrpark(); };
  const fertig = async (r, text) => {
    zustand.abgang = null;
    await auffrischen();
    melde(text);
  };
  if (art === "verkauf") {
    const erloes = h("input", { type: "number", min: 0, max: 1000000000, required: true, value: 0 });
    setTimeout(() => erloes.select(), 0);
    return h("div", { class: "rueckgabe" },
      h("p", { class: "klein" }, "Der Erlös geht in die Firmenkasse. Danach lässt sich " + t.plate
        + " nicht mehr ausleihen, Buchungen und alte Kennzeichen bleiben."),
      formular(async () => {
          const preis = Number(erloes.value);
          const r = await api("POST", "/api/trucks/" + t.id + "/sell", { price: preis });
          await fertig(r, t.plate + " ist verkauft" + (preis ? ", " + euro(preis) + " in der Firmenkasse." : "."));
        },
        h("div", { class: "zeile" },
          feld("Erlös in Euro", erloes),
          h("button", {}, "Verkauf buchen"),
          h("button", { type: "button", class: "leise", onclick: zu }, "Abbrechen"))));
  }
  return h("div", { class: "rueckgabe" },
    h("p", { class: "klein" }, t.plate + " ausmustern? Er lässt sich danach nicht mehr ausleihen und steht unter "
      + "\u201eAusgemustert und verkauft\u201c. Buchungen und alte Kennzeichen bleiben. Gebucht wird nichts."),
    h("div", { class: "zeile" },
      h("button", { type: "button", onclick: (e) => versuche(async () => {
        const r = await api("POST", "/api/trucks/" + t.id + "/retire", {});
        await fertig(r, t.plate + " ist ausgemustert.");
      }, e.target) }, "Ausmustern bestätigen"),
      h("button", { type: "button", class: "leise", onclick: zu }, "Abbrechen")));
}

/** Meldung nach einer Rückgabe: Schaden, Haftung und ob der Lkw jetzt in der Werkstatt steht. */
function nachRueckgabe(t, r, anfang) {
  let text = anfang + " Schaden " + prozent(r.damage) + ".";
  if (r.liability > 0) {
    const wer = r.liability_user_id === zustand.ich.user_id ? "deinem Lohnkonto"
      : "dem Lohnkonto von " + ((t.leased_by && t.leased_by.name) || "dem Fahrer");
    text += " Haftung für " + zehntel(r.damage_new) + " Prozentpunkte neuen Schaden: " + euro(r.liability) + " von " + wer + ".";
  }
  if (r.in_workshop) text += " Das ist über der Grenze von " + prozent(r.damage_limit) + ", der Lkw steht jetzt in der Werkstatt.";
  melde(text);
}

function baueRueckgabe(t) {
  const chef = zustand.firma.your_role === "chef";
  const meiner = t.leased_by && t.leased_by.user_id === zustand.ich.user_id;
  const stand = h("input", { type: "number", min: t.odometer_km, value: t.odometer_km, required: true });
  const zu = () => { zustand.rueckgabe = null; zeichneFuhrpark(); };
  // Ohne Kilometerstand nimmt nur der Chef zurück, mit dem letzten bekannten Zustand aus dem Herzschlag
  const letzter = chef && !meiner && t.last_known
    ? h("div", { style: "margin-top: .75rem" },
        h("p", { class: "klein" }, "Letzter bekannter Zustand von " + wann(t.last_known.at)
          + (t.last_known.odometer_km != null ? ", " + km(t.last_known.odometer_km) : "")
          + ". Gedacht für den Fall, dass der Fahrer abgestürzt ist und keinen Spielstand mehr liefern kann."),
        h("button", { type: "button", class: "leise", onclick: (e) => versuche(async () => {
          const r = await api("POST", "/api/trucks/" + t.id + "/checkin", {});
          zustand.rueckgabe = null;
          await auffrischen();
          nachRueckgabe(t, r, t.plate + " ist zurück mit dem letzten bekannten Zustand von " + wann(r.from_last_known.at) + ", " + km(r.driven_km) + " gefahren.");
        }, e.target) }, "Mit letztem bekanntem Zustand zurücknehmen"))
    : null;
  const form = formular(async () => {
      const r = await api("POST", "/api/trucks/" + t.id + "/checkin", { odometer_km: Number(stand.value) });
      zustand.rueckgabe = null;
      await auffrischen();
      nachRueckgabe(t, r, t.plate + " ist zurück, " + km(r.driven_km) + " gefahren.");
    },
    h("div", { class: "zeile" },
      feld("Kilometerstand bei Rückgabe", stand),
      h("button", {}, "Rückgabe buchen"),
      h("button", { type: "button", class: "leise", onclick: zu }, "Abbrechen")));
  setTimeout(() => stand.select(), 0);
  return h("div", { class: "rueckgabe" }, form, letzter);
}

/** Wo ein Fahrer gerade ist, aus dem letzten Herzschlag. */
function unterwegs(m) {
  if (!m.online) return null;
  const teile = [];
  if (m.plate) teile.push(h("div", {}, "Lkw " + m.plate + (m.model ? " (" + modellName(m.model) + ")" : "")
    + (m.speed_kmh != null ? ", " + Math.round(m.speed_kmh) + " km/h" : "")));
  if (m.near_city) teile.push(h("div", { class: "klein" }, "bei " + m.near_city));
  if (m.job) {
    const j = m.job;
    const strecke = j.source_city && j.target_city ? j.source_city + " nach " + j.target_city
      : j.target_city ? "nach " + j.target_city : j.source_city ? "von " + j.source_city : "";
    teile.push(h("div", { class: "klein" }, "Auftrag: " + [j.cargo, strecke].filter(Boolean).join(", ")));
  } else {
    teile.push(h("div", { class: "klein blass" }, "kein Auftrag"));
  }
  if (m.foreign_truck) teile.push(h("div", { class: "klein fremd" }, "fährt fremden Lkw " + m.foreign_truck.plate));
  return teile;
}

    h("p", { class: "klein blass" }, "Online ist, wessen Spiel sich in den letzten 30 Sekunden gemeldet hat. Das Level kommt mit dem Geldabgleich aus dem Spielstand. Ein Fragezeichen heißt: noch kein Abgleich."
      + (chef ? " Das Firmenprofil meldet der Launcher. Ist eins gemeldet, bucht der Server nur Ereignisse aus diesem Profil." : "")));
}

/** Das eigene gemeldete Firmenprofil, oder null. */
function meinProfil() {
  const ich = zustand.firma && zustand.firma.members.find((m) => m.user_id === zustand.ich.user_id);

/** Ein Kontrollkästchen zum Auswählen einer Buchung für das Storno (nur Chef). */
function auswahlKasten(id, info, beschreibung) {
  return h("input", { type: "checkbox", class: "wahl", checked: zustand.auswahl.has(id), "aria-label": "Auswählen: " + beschreibung,

      zustand.buchStand = null;
      zeichneAuswahl();
    } });
}

/** "storniert am 18.11.2026 09:12 (Grund)" unter einer stornierten Buchung. */
function stornoHinweis(am, grund, wer) {
  return h("div", { class: "storno-hinweis" }, "storniert am " + datum(am) + " " + uhrzeit(am)
    + (grund ? " (" + grund + ")" : "") + (wer ? ", von " + wer : ""));
}

/** Eine Lohnabrechnung als Zeile, aufklappbar mit den Fahrern. */
function laufZeilen(l, chef) {
  const auf = zustand.offen.has(l.id);
  const knopf = h("button", { type: "button", "aria-expanded": auf ? "true" : "false", onclick: () => {
    if (zustand.offen.has(l.id)) zustand.offen.delete(l.id); else zustand.offen.add(l.id);
    zeichneBuch(true);
  } }, (l.kind === "hand" ? "Lohnabrechnung von Hand " : "Lohnabrechnung ") + tag(l.day));
  const offen = l.lines.reduce((s, x) => s + x.claim_after, 0);
  const storniert = l.lines.filter((x) => x.reversed_by != null).length;
  const zeilen = [h("tr", { class: "lauf" },
    h("td", { class: "wann" }, wann(l.created_at)),
    h("td", {}, knopf, offen > 0 ? h("div", { class: "klein minus" }, "offen geblieben: " + euro(offen)) : null,
      storniert ? h("div", { class: "storno-hinweis" }, storniert === 1 ? "1 Lohnbuchung storniert" : storniert + " Lohnbuchungen storniert") : null),
    h("td", { class: "zahl" }, l.paid ? h("span", { class: "minus" }, euro(-l.paid)) : ""),
    h("td", { class: "zahl" }, l.paid ? "+" + euro(l.paid) : ""))];
  if (auf) {
    zeilen.push(h("tr", {}, h("td", { colspan: 4, class: "innen" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "Fahrer"), h("th", { class: "zahl" }, "Lohn"),
        h("th", { class: "zahl" }, "Gezahlt"), h("th", { class: "zahl" }, "Offen"))),
      h("tbody", {}, l.lines.map((x) => {
        const weg = x.reversed_by != null;
        // Die Lohnbuchung eines Fahrers lässt sich einzeln stornieren, das Geld geht an die Kasse zurück
        const wahl = chef && x.entry_id != null && !weg
          ? auswahlKasten(x.entry_id, { amount: x.paid, account: "fahrer", kind: "lohn" }, "Lohn " + x.name + " " + tag(l.day))
          : null;
        return h("tr", { class: weg ? "storniert" : "" },
          h("td", {}, wahl, h("span", { class: "durch" }, x.name), h("div", { class: "klein blass" },
            km(x.km) + ", " + (x.stage == null ? "keine Stufe" : "Stufe " + x.stage + " mit " + cent(x.cents_per_km))
            + (x.flat_days ? ", Pauschale " + euro(x.flat) : "")
            + (x.claim_before ? ", dazu alter Lohn " + euro(x.claim_before) : "")),
            weg ? stornoHinweis(x.reversed_at, x.reverse_reason, x.reversed_by_user) : null),
          h("td", { class: "zahl" }, euro(x.wage)),
          h("td", { class: "zahl" }, h("span", { class: "durch" }, euro(x.paid))),
          h("td", { class: "zahl" + (x.claim_after > 0 ? " minus" : "") }, x.claim_after ? euro(x.claim_after) : ""));
      }))))));
  }
  return zeilen;
}

/** Als Lkw-Kauf verknüpfen: Knopf an unverknüpften Betriebskosten, Lösen an verknüpften (nur Chef). */
function kaufKnoepfe(e) {
  if (zustand.firma.your_role !== "chef") return null;
  const id = zustand.firmaId;
  if (e.truck_id != null) {
    return h("button", { type: "button", class: "leise mini", onclick: (ev) => versuche(async () => {
      await api("DELETE", "/api/companies/" + id + "/ledger/" + e.id + "/link-truck");
      await auffrischen();
      melde("Verknüpfung gelöst. Die Buchung steht wieder als Betriebskosten im Kassenbuch.");
    }, ev.target) }, "Verknüpfung lösen");
  }
  if (e.kind !== "betriebskosten" || e.account !== "firma") return null;
  if (zustand.verknuepfen !== e.id) {
    return h("button", { type: "button", class: "leise mini", onclick: () => { zustand.verknuepfen = e.id; zeichneBuch(true); } },
      "Als Lkw-Kauf verknüpfen");
  }
  const aktiv = zustand.lkw.filter((t) => !t.retired);
  const raus = zustand.lkw.filter((t) => t.retired);
  const wahl = h("select", { "aria-label": "Welcher Lkw wurde gekauft" },
    aktiv.concat(raus).map((t) => h("option", { value: t.id }, t.plate + (t.retired ? " (nicht mehr im Fuhrpark)" : ""))));
  const zu = () => { zustand.verknuepfen = null; zeichneBuch(true); };
  if (!zustand.lkw.length) {
    return h("div", { class: "verknuepfen" }, h("span", { class: "klein blass" }, "Noch kein Lkw im Fuhrpark."),
      h("button", { type: "button", class: "leise mini", onclick: zu }, "Abbrechen"));
  }
  return h("div", { class: "verknuepfen" }, wahl,
    h("button", { type: "button", class: "mini", onclick: (ev) => versuche(async () => {
      const r = await api("POST", "/api/companies/" + id + "/ledger/" + e.id + "/link-truck", { truck_id: Number(wahl.value) });
      zustand.verknuepfen = null;
      await auffrischen();
      melde("Verknüpft. Im Kassenbuch steht jetzt Lkw-Kauf " + r.truck_plate + ".");
    }, ev.target) }, "Verknüpfen"),
    h("button", { type: "button", class: "leise mini", onclick: zu }, "Abbrechen"));
}

/** Das Kassenbuch: fester Rahmen mit dem Zeitraum, darin die Teile, die sich neu zeichnen. */
function baueBuch() {
  const von = h("input", { type: "date", value: zustand.filter.von });

/** Leiste über dem Kassenbuch: Zahl der ausgewählten Buchungen und was sich damit tun lässt (nur Chef). */
function zeichneAuswahl() {
  const box = $("buch-auswahl");
  if (!box) return;
  if (zustand.firma.your_role !== "chef") { box.replaceChildren(); box.hidden = true; return; }
  box.hidden = false;
  const zahl = zustand.auswahl.size;
  box.className = "auswahl";
  box.replaceChildren(
    h("span", { class: "zaehler", "aria-live": "polite" }, zahl === 1 ? "1 Buchung ausgewählt" : zahl + " Buchungen ausgewählt"),
    h("button", { type: "button", class: "leise", onclick: () => {
      for (const e of zustand.sichtbar) zustand.auswahl.set(e.id, { amount: e.amount, account: e.account, kind: e.kind });
      zeichneBuch(true);
    }, disabled: !zustand.sichtbar.length }, "Alle sichtbaren auswählen"),
    h("button", { type: "button", class: "leise", onclick: () => { zustand.auswahl.clear(); zeichneBuch(true); }, disabled: !zahl }, "Auswahl leeren"),
    h("button", { type: "button", onclick: zeigeStorno, disabled: !zahl }, "Auswahl stornieren"),
    h("p", { class: "klein blass" }, "\u201eAlle sichtbaren\u201c lässt Betriebskosten aus: Die korrigiert der Server, wenn du die Ereignisse dahinter stornierst."));
}

/** Bestätigung mit Pflichtgrund, dann stornieren. */
function zeigeStorno() {
  const liste = [...zustand.auswahl.entries()];
  if (!liste.length) return;
  const summe = (konto) => liste.filter(([, i]) => i.account === konto).reduce((s, [, i]) => s - i.amount, 0);
  const vz = (n) => (n > 0 ? "+" : "") + euro(n);
  const kasse = summe("firma");
  const lohn = summe("fahrer");
  const kosten = liste.filter(([, i]) => i.kind === "betriebskosten").length;
  const grund = h("input", { required: true, minlength: 3, maxlength: 200, autocomplete: "off" });
  const fehler = h("p", { class: "fehlertext klein", role: "alert" });
  const dialog = h("dialog", { "aria-labelledby": "stornotitel" });
  const zu = () => { dialog.close(); dialog.remove(); };
  const senden = async (ev) => {
    ev.preventDefault();
    fehler.textContent = "";
    const knopf = ev.submitter;
    if (knopf) knopf.disabled = true;
    try {
      const r = await api("POST", "/api/companies/" + zustand.firmaId + "/ledger/reverse",
        { entry_ids: liste.map(([id]) => id), reason: grund.value });
      zu();
      zustand.auswahl.clear();
      zustand.buchStand = null;
      await auffrischen();
      melde(stornoMeldung(r));
    } catch (err) {
      if (err instanceof ApiFehler && err.status === 401) { zu(); abmeldenLokal(); melde("Deine Anmeldung ist abgelaufen. Melde dich neu an.", true); }
      else fehler.textContent = err.message || String(err);
    } finally {
      if (knopf) knopf.disabled = false;
    }
  };
  dialog.append(...[
    h("h2", { id: "stornotitel" }, liste.length === 1 ? "1 Buchung stornieren" : liste.length + " Buchungen stornieren"),
    h("p", {}, "Jede bekommt eine Buchung mit umgekehrtem Betrag. Die Buchungen selbst bleiben stehen und erscheinen durchgestrichen. "
      + "Ein Storno lässt sich nicht zurücknehmen."),
    h("p", {}, "Kasse " + vz(kasse) + ", Lohnkonten " + vz(lohn) + "."),
    h("p", { class: "klein blass" }, "Überweisungen und Haftung werden mit der Gegenseite storniert, Lohn mit einer Gegenbuchung in der Kasse. "
      + "Liegt ein Ereignis in einem schon abgeglichenen Zeitraum, rechnet der Server den Geldabgleich neu und bucht zu viel gebuchte Betriebskosten zurück."),
    kosten ? h("p", { class: "klein warnung" }, (kosten === 1 ? "Darunter ist eine Betriebskosten-Buchung" : "Darunter sind " + kosten + " Betriebskosten-Buchungen")
      + ". Ein Storno erlässt sie der Firma. Sind sie durch stornierte Ereignisse schon korrigiert, lehnt der Server ab.") : null,
    h("form", { onsubmit: senden },
      feld("Grund, 3 bis 200 Zeichen", grund),
      fehler,
      h("div", { class: "zeile" },
        h("button", {}, "Stornieren"),
        h("button", { type: "button", class: "leise", onclick: zu }, "Abbrechen"))),
  ].filter(Boolean));
  dialog.addEventListener("cancel", () => setTimeout(() => dialog.remove(), 0));
  document.body.append(dialog);
  dialog.showModal();
  grund.focus();
}

/** Was nach einem Storno passiert ist, als Meldung. */
function stornoMeldung(r) {
  const n = r.entries.length;
  let text = (n === 1 ? "1 Storno gebucht" : n + " Stornos gebucht") + ". In der Kasse: " + euro(r.balance) + ".";
  const korr = r.drivers.flatMap((d) => d.corrections);
  if (korr.length) {
    const zurueck = korr.flatMap((c) => c.booked).reduce((s, b) => s + b.amount, 0);
    text += " Geldabgleich neu gerechnet" + (zurueck > 0 ? ", " + euro(zurueck) + " Betriebskosten zurück"
      : zurueck < 0 ? ", " + euro(-zurueck) + " Betriebskosten nachgebucht" : "") + ".";
  }
  const offen = r.drivers.reduce((s, d) => s + d.open_window, 0);
  if (offen) text += " " + (offen === 1 ? "1 Ereignis zählt" : offen + " Ereignisse zählen") + " beim nächsten Abgleich nicht mehr.";
  return text;
}

/** Zeichnet Kopf, Auswahl und Liste des Kassenbuchs. Ohne `immer` nur, wenn sich etwas geändert hat,
 *  damit das Auffrischen alle 5 Sekunden weder Fokus noch Scrollstand stört. */
function zeichneBuch(immer) {
  const chef = zustand.firma.your_role === "chef";
  const ich = zustand.firma.members.find((m) => m.user_id === zustand.ich.user_id);
  const stand = JSON.stringify([zustand.buch, zustand.laeufe, zustand.ungeklaert, [...zustand.auswahl.keys()], [...zustand.offen],
    zustand.filter, zustand.firma.balance, ich && [ich.wallet, ich.open_claim], zustand.firma.payroll_time,
    zustand.lkw.map((t) => [t.id, t.plate, !!t.retired])]);
  if (!immer && stand === zustand.buchStand) return;
  zustand.buchStand = stand;

  // Buchungen einer Lohnabrechnung stehen nicht einzeln da, sondern als eine Zeile je Abrechnung.
  const einzeln = zustand.buch.entries.filter((e) => e.payroll_id == null);
  const posten = einzeln.map((e) => ({ t: e.created_at, id: e.id, e }))
    .concat(zustand.laeufe.filter((l) => l.lines.length).map((l) => ({ t: l.created_at, id: Infinity, l })))
    .sort((a, b) => b.t - a.t || b.id - a.id);
  // "Alle sichtbaren auswählen": stornierbar, ohne Betriebskosten (die korrigiert der Abgleich selbst)
  zustand.sichtbar = chef ? einzeln.filter((e) => e.reversible && e.kind !== "betriebskosten") : [];
  const zeilen = posten.flatMap(({ e, l }) => {
    if (l) return laufZeilen(l, chef);
    const weg = e.reversed_by != null;
    const istStorno = e.kind === "storno";
    const betrag = h("span", { class: (e.amount < 0 ? "minus " : "") + "durch" }, (e.amount > 0 ? "+" : "") + euro(e.amount));
    const zusatz = [];
    if (e.cargo) zusatz.push(e.cargo);
    if (e.source_city && e.target_city) zusatz.push(e.source_city + " nach " + e.target_city);
    else if (e.target_city) zusatz.push("nach " + e.target_city);
    else if (e.source_city) zusatz.push("von " + e.source_city);
    if (e.distance_km != null) zusatz.push(km(e.distance_km));
    if (e.game_amount != null && e.game_amount !== e.amount && e.kind === "auftrag") zusatz.push("im Spiel " + euro(e.game_amount));
    if (e.note) zusatz.push(e.note);
    if (istStorno && e.booked_by_user) zusatz.push("von " + e.booked_by_user);
    // Als Lkw-Kauf verknüpfte Betriebskosten stehen mit dem aktuellen Kennzeichen da
    let art = e.truck_plate != null ? "Lkw-Kauf " + e.truck_plate : ARTEN[e.kind] || e.kind;
    if (istStorno) {
      // Art und Buchungszeit des Originals, dahinter Grund und wer storniert hat
      art = "Storno von " + (ARTEN_STORNO[e.reverses_kind] || e.reverses_kind || "Buchung");
      if (e.reverses_created_at != null) zusatz.unshift("gebucht " + wann(e.reverses_created_at));
    }
    const text = [art, e.user ? ", " + e.user : "", zusatz.length ? " (" + zusatz.join(", ") + ")" : ""].join("");
    const wahl = chef && e.reversible ? auswahlKasten(e.id, { amount: e.amount, account: e.account, kind: e.kind }, text) : null;
    return [h("tr", { class: weg ? "storniert" : istStorno ? "storno" : "" },
      h("td", { class: "wann" }, wahl ? h("label", {}, wahl, wann(e.created_at)) : wann(e.created_at)),
      h("td", {}, h("span", { class: "durch" }, text), weg ? stornoHinweis(e.reversed_at, e.reverse_reason, e.reversed_by_user) : null,
        weg ? null : kaufKnoepfe(e)),
      h("td", { class: "zahl" }, e.account === "firma" ? betrag : ""),
      h("td", { class: "zahl" }, e.account === "fahrer" ? betrag : ""))];
  });

  const f = zustand.filter;
  const bereich = f.von || f.bis;
  $("buch-kopf").replaceChildren(
    h("h2", {}, "Kassenbuch"),
    h("div", { class: "bestand" + (zustand.firma.balance < 0 ? " minus" : "") }, euro(zustand.firma.balance)),
    h("div", {}, "in der Firmenkasse"),
    ich ? h("div", { class: "klein blass" }, "Dein Lohnkonto: " + euro(ich.wallet)
      + (ich.open_claim ? ", offener Lohn " + euro(ich.open_claim) : "")
      + ". Abrechnung täglich um " + zustand.firma.payroll_time + " Uhr") : null);
  zeichneAuswahl();
  $("buch-ungeklaert").replaceChildren(...[baueUngeklaert()].filter(Boolean));

  const liste = $("buch-liste");
  const scroll = liste.scrollTop;
  const voll = zustand.buch.entries.length >= buchGrenze();
  liste.replaceChildren(...[
    bereich ? h("p", { class: "klein blass bereich" }, "Gezeigt "
      + (f.von ? "ab " + tag(f.von) : "") + (f.von && f.bis ? " " : "") + (f.bis ? "bis einschließlich " + tag(f.bis) : "")
      + ". Kassenstand und Lohnkonto zählen immer alle Buchungen.") : null,
    voll ? h("p", { class: "klein blass bereich" }, "Gezeigt sind die neuesten " + buchGrenze() + " Buchungen. Für ältere den Zeitraum eingrenzen.") : null,
    zeilen.length
      ? h("table", {},
          h("thead", {}, h("tr", {}, h("th", { class: "wann" }, "Wann"), h("th", {}, "Was"), h("th", { class: "zahl" }, "Kasse"), h("th", { class: "zahl" }, "Lohnkonto"))),
          h("tbody", {}, zeilen))
      : h("p", { style: "padding: 1rem" }, bereich ? "In diesem Zeitraum gibt es keine Buchungen."
        : "Noch keine Buchungen. Die erste kommt mit dem ersten abgelieferten Auftrag."),
  ].filter(Boolean));
  liste.scrollTop = scroll;
}

// ---- Büro (nur Chef)

function fuelleFahrerwahl() {
  const wahl = $("fahrerwahl");
  if (!wahl) return;
  const neu = JSON.stringify(zustand.firma.members.map((m) => [m.user_id, m.name]));
  if (wahl.dataset.stand === neu) return;
  const vorher = wahl.value;
  wahl.replaceChildren(...zustand.firma.members.map((m) => h("option", { value: m.user_id }, m.name)));
  if (vorher) wahl.value = vorher;
  wahl.dataset.stand = neu;
}

/** Vorschläge für das Kennzeichen im Testbereich: die Lkw des Fuhrparks, deiner zuerst. */
function fuelleKennzeichen() {
  const liste = $("kennzeichen");
  if (!liste) return;
  const meine = zustand.lkw.filter((t) => t.leased_by && t.leased_by.user_id === zustand.ich.user_id);
  const rest = zustand.lkw.filter((t) => !meine.includes(t) && !t.retired);
  const neu = JSON.stringify(meine.concat(rest).map((t) => t.plate));
  if (liste.dataset.stand === neu) return;
  liste.replaceChildren(...meine.concat(rest).map((t) => h("option", { value: t.plate })));
  liste.dataset.stand = neu;
  const feldKz = $("herzschlag-kz");
  if (feldKz && !feldKz.value && meine.length) {
    feldKz.value = meine[0].plate;
    modellZumKennzeichen();
  }
}

/** Im Testbereich: das Modell des Lkw mit dem eingetragenen Kennzeichen, wie es das Plugin meldet. */
function modellZumKennzeichen() {
  const kz = $("herzschlag-kz"), modell = $("herzschlag-modell");
  if (!kz || !modell) return;
  const t = zustand.lkw.find((x) => !x.retired && x.plate.toUpperCase() === kz.value.trim().toUpperCase());
  if (t) modell.value = t.model;
}

/** Im Büro: das Kennzeichen für den nächsten Lkw, vorbelegt mit dem Vorschlag des Servers. */
function fuelleVorschlag() {
  const kz = $("neu-kz");
  if (!kz || !zustand.vorschlag) return;
  // Was der Chef selbst eingetragen hat, bleibt
  if (document.activeElement !== kz && (kz.value === "" || kz.value === kz.dataset.vorschlag)) kz.value = zustand.vorschlag;
  kz.dataset.vorschlag = zustand.vorschlag;
}

function baueBuero() {
  const id = zustand.firmaId;
  const f0 = zustand.firma;
  const faktor = h("input", { type: "number", min: 0.0001, max: 10000, step: "any", value: f0.revenue_factor, required: true });
  const pauschale = h("input", { type: "number", min: 0, max: 100000, value: f0.daily_flat, required: true });

            () => melde("Einladungscode kopiert."), () => melde("Kopieren ging nicht. Markier den Code von Hand.", true)) }, "Code kopieren"))),
      h("div", { class: "blatt" },
        h("h3", {}, "Lohn und Geld"),

        formular(async () => {
            await api("PATCH", "/api/companies/" + id, {
              revenue_factor: Number(faktor.value), daily_flat: Number(pauschale.value),
              payroll_time: uhr.value, advance: Number(vorschuss.value) });
            await auffrischen();
            melde("Einstellungen gespeichert.");
          },
          feld("Tagespauschale in Euro", pauschale),
          feld("Tägliche Abrechnung um (Uhrzeit in Deutschland)", uhr),
          feld("Betriebsvorschuss in Euro, zusätzlich zum Lohnkonto im Spiel", vorschuss),
          feld("Erlösfaktor: der gemeldete Erlös mal diese Zahl geht in die Kasse", faktor),
          h("button", {}, "Einstellungen speichern"))),
      h("div", { class: "blatt" },
        h("h3", {}, "Werkstatt und Haftung"),

        formular(async () => {

              damage_limit: Number(grenze.value), repair_rate: Number(satz.value), liability_percent: Number(haftung.value) });
            await auffrischen();
            melde("Werkstatt und Haftung gespeichert. Die Grenze gilt ab der nächsten Rückgabe.");
          },
          feld("Schadensgrenze in Prozent", grenze),
          feld("Werkstatt: Euro je Prozentpunkt Schaden", satz),
          feld("Haftung: so viel Prozent des neuen Schadens zahlt der Fahrer", haftung),
          h("button", {}, "Werkstatt und Haftung speichern"))),
      h("div", { class: "blatt" },
        h("h3", {}, "Anschaffungsbudget"),
        h("p", { class: "klein" }, "Für einen Kauf im Spiel, etwa einen Lkw. Der Betrag kommt beim nächsten Geldabgleich zusätzlich "

          + "Was du im Spiel ausgibst, bucht der Abgleich als Betriebskosten und zieht es vom Budget ab, auch Tanken und Reparaturen. "
          + "Den Kauf kannst du danach im Kassenbuch mit dem Lkw verknüpfen."),
        h("div", { id: "budget-stand" }),
        bForm),
      baueStufen(),
      h("div", { class: "blatt ganz" },
        h("h3", {}, "Abgelehnte Ereignisse"),
        h("p", { class: "klein" }, "Ereignisse aus einem anderen Profil als dem gemeldeten Firmenprofil des Fahrers. "
          + "Der Server hat sie nicht gebucht, sie stehen nur hier."),
        h("div", { id: "abgelehnt" })),
      h("div", { class: "blatt" },
        h("h3", {}, "Lkw anlegen"),
        h("p", { class: "klein" }, "Jeder Lkw bekommt ein eigenes Kennzeichen in der Firma, mit dem der Launcher ihn in die Spielstände setzt. "
          + "Vorgeschlagen ist das nächste freie aus dem Kürzel der Firma. Leer lassen nimmt den Vorschlag."),
        formular(async (f) => {
            const r = await api("POST", "/api/companies/" + id + "/trucks", { plate: kz.value, model: modell.value, odometer_km: Number(stand.value) });
            f.reset();
            await auffrischen();
            melde(r.plate + " steht jetzt im Fuhrpark.");
          },
          feld("Kennzeichen", kz),
          feld("Modell, so wie es im Spiel heißt", modell),
          feld("Kilometerstand", stand),
          h("button", {}, "Lkw anlegen"))),
      h("div", { class: "blatt" },
        h("h3", {}, "Geld überweisen"),
        formular(async (f) => {
            const summe = Number(betrag.value) * Number(richtung.value);
            await api("POST", "/api/companies/" + id + "/transfer", { user_id: Number(wer.value), amount: summe, note: notiz.value });
            f.reset();
            await auffrischen();
            melde("Überweisung gebucht.");

/** Liste der abgelehnten Ereignisse im Büro. */
function zeichneAbgelehnt() {
  const box = $("abgelehnt");
  if (!box) return;
  const liste = zustand.abgelehnt;
  const neu = JSON.stringify(liste.map((e) => e.id));
  if (box.dataset.stand === neu) return;
  box.dataset.stand = neu;
  if (!liste.length) {
    box.replaceChildren(h("p", { class: "klein blass" }, "Keine. Alles, was ankam, kam aus dem Firmenprofil oder es ist keins gemeldet."));
    return;
  }
  box.replaceChildren(h("div", { style: "overflow-x: auto" }, h("table", {},
    h("thead", {}, h("tr", {}, h("th", {}, "Zeit"), h("th", {}, "Fahrer"), h("th", {}, "Art"),
      h("th", { class: "zahl" }, "Betrag"), h("th", {}, "Profil"), h("th", {}, "Grund"))),
    h("tbody", {}, liste.map((e) => h("tr", {},
      h("td", { class: "wann" }, wann(e.created_at)),
      h("td", {}, e.user),
      h("td", {}, ARTEN_SPIEL[e.type] || e.type),
      h("td", { class: "zahl" }, euro(e.amount)),
      h("td", {}, e.profile == null ? h("span", { class: "klein blass" }, "keins") : e.profile),
      h("td", { class: "klein" }, e.reason)))))));
}

/** Das Profil, mit dem der Testbereich bucht. */
function zeichneMeinProfil() {
  const box = $("mein-profil");
  if (!box) return;
  const p = meinProfil();
  const text = p ? "Gebucht wird wie aus deinem Firmenprofil " + p + "." : "Du hast kein Firmenprofil gemeldet, der Server bucht deshalb ohne Prüfung des Profils.";
  if (box.textContent !== text) box.textContent = text;
}

/** Das offene Anschaffungsbudget mit Restbetrag. Ohne offenes Budget erscheint das Formular. */
function zeichneBudget() {
  const box = $("budget-stand");
  const form = $("budget-form");
  if (!box || !form) return;
  const b = zustand.firma.budget || null;
  const neu = JSON.stringify([b, zustand.firma.balance]);
  if (box.dataset.stand === neu) return;
  box.dataset.stand = neu;
  form.hidden = !!b;
  if (!b) {
    box.replaceChildren(h("p", { class: "klein blass" }, "Gerade ist kein Budget offen. In der Kasse sind " + euro(zustand.firma.balance) + "."));
    return;
  }
  box.replaceChildren(h("div", { class: "budget-stand" },
    h("div", { class: "klein blass" }, "Offen seit " + wann(b.created_at) + (b.note ? ", " + b.note : "")),
    h("div", { class: "rest" }, euro(b.rest)),
    h("p", { class: "klein" }, "übrig von " + euro(b.amount) + ". Als Betriebskosten gebucht: " + euro(b.consumed)
      + ". Beim Schließen wird nichts gebucht, der Rest kommt beim nächsten Abgleich nicht mehr in den Spielstand."),
    h("button", { type: "button", class: "leise", onclick: (e) => versuche(async () => {
      const r = await api("POST", "/api/companies/" + zustand.firmaId + "/budgets/" + b.id + "/close", {});
      await auffrischen();
      melde("Budget geschlossen. Beim nächsten Abgleich entfallen die restlichen " + euro(r.budget.rest) + " im Spiel.");
    }, e.target) }, "Budget schließen")));
}

function baueStufen() {
  const id = zustand.firmaId;
  let stufen = zustand.firma.wage_levels.map((w) => ({ ...w }));
  const box = h("div", {});
  const zahlfeld = (s, k, max) => h("input", { type: "number", min: 0, max, value: s[k], required: true,
    "aria-label": k, oninput: (e) => { s[k] = Number(e.target.value); } });
  const zeichne = () => box.replaceChildren(
    h("div", { style: "overflow-x: auto" }, h("table", { class: "stufen" },
      h("thead", {}, h("tr", {}, h("th", {}, "Stufe"), h("th", {}, "ab Level"), h("th", {}, "ab Firmen-km"), h("th", {}, "Cent je km"), h("th", {}, ""))),
      h("tbody", {}, stufen.map((s, i) => h("tr", {},
        h("td", {}, String(i + 1)),
        h("td", {}, zahlfeld(s, "min_level", 1000)),
        h("td", {}, zahlfeld(s, "min_km", 100000000)),
        h("td", {}, zahlfeld(s, "cents_per_km", 100000)),
        h("td", {}, stufen.length > 1 ? h("button", { type: "button", class: "leise", onclick: () => { stufen.splice(i, 1); zeichne(); } }, "Entfernen") : null)))))),
    h("div", { class: "zeile", style: "margin-top: .75rem" },
      h("button", { type: "button", class: "leise", onclick: () => {
        const letzte = stufen[stufen.length - 1];
        stufen.push({ min_level: letzte.min_level, min_km: letzte.min_km, cents_per_km: letzte.cents_per_km });
        zeichne();
      } }, "Stufe hinzufügen"),
      h("button", {}, "Lohnstufen speichern")));
  zeichne();
  return h("div", { class: "blatt ganz" },
    h("h3", {}, "Lohnstufen"),
    h("p", { class: "klein" }, "Ein Fahrer hat die letzte Stufe in der Liste, bei der er beide Bedingungen erfüllt: Level im Spiel und Kilometer für die Firma."),
    formular(async () => {
        const r = await api("PUT", "/api/companies/" + id + "/wage-levels", {
          levels: stufen.map((s) => ({ min_level: s.min_level, min_km: s.min_km, cents_per_km: s.cents_per_km })) });
        stufen = r.wage_levels.map((w) => ({ ...w }));
        zeichne();
        await auffrischen();
        melde("Lohnstufen gespeichert. Sie gelten ab der nächsten Abrechnung.");
      }, box));
}

// ---- Buchen von Hand, solange es noch kein Plugin gibt

function baueTestbuchung() {
  const id = zustand.firmaId;
  const chef = zustand.firma.your_role === "chef";
  const art = h("select", {},
    h("option", { value: "job_delivered" }, "Auftrag abgeliefert (Erlös an die Firma)"),
    h("option", { value: "job_cancelled" }, "Auftrag abgebrochen (zahlt der Fahrer)"),
    h("option", { value: "fined" }, "Strafe (zahlt der Fahrer)"),
    h("option", { value: "tollgate" }, "Maut (zahlt die Firma)"),
    h("option", { value: "ferry" }, "Fähre (zahlt die Firma)"),
    h("option", { value: "train" }, "Zug (zahlt die Firma)"));
  const betrag = h("input", { type: "number", min: 0, required: true });
  const strecke = h("input", { type: "number", min: 0, max: 100000, step: "any" });
  const streckeFeld = feld("Strecke in km", strecke);
  art.addEventListener("change", () => { streckeFeld.hidden = art.value !== "job_delivered"; });
  const notiz = h("input", { maxlength: 80 });

  const geld = h("input", { type: "number", required: true });
  const xp = h("input", { type: "number", min: 0 });

  const hbKz = h("input", { required: true, maxlength: 64, list: "kennzeichen", placeholder: "SPED 001" });
  hbKz.id = "herzschlag-kz";
  hbKz.addEventListener("change", modellZumKennzeichen);
  const hbModell = h("input", { maxlength: 64, placeholder: "scania.s_2016" });
  hbModell.id = "herzschlag-modell";
  const hbKm = h("input", { type: "number", min: 0, step: "any" });
  const hbTempo = h("input", { type: "number", min: 0, max: 1000, step: "any", value: 85 });
  const hbStadt = h("input", { maxlength: 64 });
  const hbFracht = h("input", { maxlength: 64 });
  const hbVon = h("input", { maxlength: 64 });
  const hbNach = h("input", { maxlength: 64 });

  return h("details", {},
    h("summary", {}, "Ereignis von Hand buchen"),
    h("p", { class: "klein blass" }, "Zum Testen ohne Spiel. Sonst meldet das Plugin diese Ereignisse von selbst. Gebucht wird auf dich als Fahrer."),
    h("p", { class: "klein blass", id: "mein-profil" }),
    formular(async (f) => {
        const ereignis = "hand-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
        const daten = { event_id: ereignis, type: art.value, amount: Number(betrag.value), note: notiz.value };
        // Wie das Plugin: mit dem Firmenprofil, sonst lehnt der Server ab
        if (meinProfil()) daten.profile = meinProfil();
        if (art.value === "job_delivered" && strecke.value !== "") daten.distance_km = Number(strecke.value);
        const r = await api("POST", "/api/companies/" + id + "/events", daten);
        f.reset();
        streckeFeld.hidden = false;
        await auffrischen();
        melde(r.late ? "Gebucht. Das Ereignis lag vor deinem letzten Abgleich, der Abgleich wurde korrigiert." : "Gebucht.");
      },
      h("div", { class: "zeile" }, feld("Was ist passiert", art, "breit"), feld("Betrag in Euro", betrag), streckeFeld, feld("Notiz", notiz), h("button", {}, "Buchen"))),
    h("h3", { style: "margin-top: 1.5rem" }, "Geldabgleich testen"),
    h("p", { class: "klein blass" }, "Tut so, als hätte der Launcher deinen Spielstand gelesen und den neuen Kontostand geschrieben."),
    formular(async () => {
        const daten = { ingame_money: Number(geld.value) };
        if (xp.value !== "") daten.xp = Number(xp.value);
        const r = await api("POST", "/api/companies/" + id + "/sync", daten);
        await api("POST", "/api/companies/" + id + "/sync/" + r.sync_id + "/written", {});
        await auffrischen();
        let text;
        if (r.first) text = "Erster Abgleich, nichts gebucht.";
        else if (r.booked.length) text = "Erwartet " + euro(r.expected) + ", Betriebskosten " + euro(-r.booked[0].amount) + " gebucht.";
        else if (r.unexplained) text = "Erwartet " + euro(r.expected) + ", " + euro(r.unexplained.amount) + " ungeklärt.";
        else text = "Erwartet " + euro(r.expected) + ", passt.";
        melde(text + " Neuer Kontostand im Spiel: " + euro(r.write_money)
          + (r.budget ? ", davon Anschaffungsbudget " + euro(r.budget) : "") + ".");
      },
      h("div", { class: "zeile" }, feld("Kontostand im Spiel", geld), feld("Erfahrungspunkte", xp), h("button", {}, "Abgleichen"))),
    h("h3", { style: "margin-top: 1.5rem" }, "Herzschlag senden"),
    h("p", { class: "klein blass" }, "Tut so, als liefe dein Spiel: Du bist 30 Sekunden online. Passen Kennzeichen und Modell zu deinem geliehenen Lkw, gilt der Stand als sein letzter bekannter Zustand. Ohne Modell gehört der Herzschlag zu keinem Firmen-Lkw. Sonst schickt das Plugin alle 10 Sekunden einen. Fracht, Von und Nach leer heißt: kein Auftrag."),
    h("datalist", { id: "kennzeichen" }),
    formular(async () => {
        const daten = { plate: hbKz.value };
        // Wie das Plugin: Modell aus der Konfiguration des Lkw
        if (hbModell.value.trim()) daten.truck_model = hbModell.value;
        if (meinProfil()) daten.profile = meinProfil();
        if (hbKm.value !== "") daten.odometer_km = Number(hbKm.value);
        if (hbTempo.value !== "") daten.speed_kmh = Number(hbTempo.value);
        if (hbStadt.value.trim()) daten.near_city = hbStadt.value;
        daten.job = hbFracht.value.trim() || hbVon.value.trim() || hbNach.value.trim()
          ? { cargo: hbFracht.value, source_city: hbVon.value, target_city: hbNach.value } : null;
        const r = await api("POST", "/api/companies/" + id + "/heartbeat", daten);
        await auffrischen();
        if (r.recorded === false) return melde(r.note || "Herzschlag verworfen.", true);
        melde(r.leased_truck_id != null
          ? "Herzschlag gesendet. Der Stand gilt als letzter bekannter Zustand deines Lkw."
          : "Herzschlag gesendet. Du bist jetzt 30 Sekunden online.");
      },
      h("div", { class: "zeile" }, feld("Kennzeichen", hbKz), feld("Modell", hbModell), feld("Kilometerstand", hbKm),
        feld("Geschwindigkeit in km/h", hbTempo), feld("Stadt in der Nähe", hbStadt)),
      h("div", { class: "zeile", style: "margin-top: .75rem" }, feld("Fracht", hbFracht), feld("Von", hbVon), feld("Nach", hbNach),
        h("button", {}, "Herzschlag senden"))),
    chef ? h("div", {},
      h("h3", { style: "margin-top: 1.5rem" }, "Lohnabrechnung"),
      h("p", { class: "klein blass" }, "Rechnet sofort alles seit der letzten Abrechnung ab. Die tägliche Abrechnung macht danach dort weiter."),
      h("button", { type: "button", onclick: (e) => versuche(async () => {
        const r = await api("POST", "/api/companies/" + id + "/payrolls/run", {});
        await auffrischen();
        const gezahlt = r.payrolls.reduce((s, l) => s + l.paid, 0);
        melde("Abgerechnet: " + euro(gezahlt) + " an die Fahrer.");
      }, e.target) }, "Lohn jetzt abrechnen")) : null);
}

// ---------------------------------------------------------------- Start

async function start() {
  if (!zustand.token) return zeigeAnmeldung(false);
  try {
    zustand.ich = await api("GET", "/api/me");
  } catch (e) {
    if (e.status === 401) { speicher.set("token", null); zustand.token = null; return zeigeAnmeldung(false); }
    $("app").replaceChildren(h("p", {}, e.message));
    return;
  }
  const gemerkt = Number(speicher.get("firma"));
  if (gemerkt && zustand.ich.companies.some((f) => f.id === gemerkt)) return oeffneFirma(gemerkt);
  if (zustand.ich.companies.length === 1) return oeffneFirma(zustand.ich.companies[0].id);
  return zeigeFirmenwahl();
}

versuche(start);
