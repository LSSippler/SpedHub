<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpedHub</title>
<link rel="icon" href="data:,">
<script>
  // Hell oder dunkel so früh wie möglich setzen, damit nichts aufblitzt
  try { var t = localStorage.getItem("thema"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
  /* ------------------------------------------------------------ Tokens (docs/design-system.md) */
  :root {
    color-scheme: light;
    --bg: #f2f4f7;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #e3e8ef;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-2: #475569;
    --text-3: #64748b;
    --primary: #1d4ed8;
    --primary-hover: #1e40af;
    --primary-soft: #e6eefc;
    --on-primary: #ffffff;
    --accent: #ea7a1a;
    --success: #166534;
    --success-soft: #e3f6ea;
    --warning: #a34a06;
    --warning-soft: #fdf1dc;
    --danger: #b91c1c;
    --danger-hover: #991b1b;
    --danger-soft: #fde7e7;
    --info: #0e7490;
    --info-soft: #e0f3f8;
    --nav-bg: #0f1e33;
    --nav-text: #c3cede;
    --nav-active: #ffffff;
    --nav-active-bg: #1b3150;
    --nav-hover-bg: #16283f;
    --nav-line: #22344f;
    --plate-bg: #ffffff;
    --plate-text: #0f172a;
    --plate-border: #0f172a;
    --plate-eu: #1d4ed8;
    --plate-eu-text: #ffffff;
    --overlay: rgb(15 23 42 / 45%);
    --shadow-sm: 0 1px 2px rgb(15 23 42 / 6%);
    --shadow-md: 0 4px 12px rgb(15 23 42 / 10%);
    --shadow-lg: 0 16px 40px rgb(15 23 42 / 18%);

    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-plate: Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    --fs-2xs: 10px;
    --fs-xs: 12px;  --lh-xs: 16px;
    --fs-sm: 13px;  --lh-sm: 18px;
    --fs-base: 14px; --lh-base: 20px;
    --fs-md: 16px;  --lh-md: 24px;
    --fs-lg: 20px;  --lh-lg: 28px;
    --fs-xl: 28px;  --lh-xl: 34px;

    --sp-half: 2px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
    --r-sm: 6px; --r-md: 10px; --r-pill: 999px;
    --dur-fast: 120ms; --dur: 200ms;

    --line: 1px; --line-plate: 2px; --line-accent: 3px; --line-toast: 4px; --ring: 2px;
    --nav-w: 240px; --topbar-h: 56px; --content-max: 1280px; --nav-item-h: 40px;
    --ctl-h: 36px; --ctl-h-sm: 30px; --sym-btn: 32px; --sym-feld: 32px;
    --avatar: 32px; --avatar-sm: 24px; --sym: 20px; --sym-sm: 16px;
    --row-h: 44px; --head-h: 40px; --bar-h: 6px; --dot: 6px; --check: 16px;
    --card-min: 320px; --kachel-min: 168px; --form-min: 180px; --menu-w: 224px;
    --dialog-w: 480px; --toast-w: 400px; --login-w: 400px; --tab-min: 960px; --tab-min-sm: 640px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1220;
    --surface: #121b2c;
    --surface-2: #0f1727;
    --border: #223049;
    --border-strong: #33425e;
    --text: #e5eaf2;
    --text-2: #a3b1c6;
    --text-3: #8191a8;
    --primary: #5b8def;
    --primary-hover: #7aa3f5;
    --primary-soft: #17284a;
    --on-primary: #0b1220;
    --accent: #f0953f;
    --success: #4ade80;
    --success-soft: #123423;
    --warning: #fbbf24;
    --warning-soft: #3a2a0c;
    --danger: #f87171;
    --danger-hover: #fca5a5;
    --danger-soft: #3b1515;
    --info: #38bdf8;
    --info-soft: #0d2c3a;
    --nav-bg: #0a1424;
    --nav-text: #aab7ca;
    --nav-active: #ffffff;
    --nav-active-bg: #162843;
    --nav-hover-bg: #111f35;
    --nav-line: #1b2a42;
    --plate-border: #0f172a;
    --overlay: rgb(0 0 0 / 60%);
    --shadow-sm: none;
    --shadow-md: 0 4px 12px rgb(0 0 0 / 45%);
    --shadow-lg: 0 16px 40px rgb(0 0 0 / 60%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b1220;
      --surface: #121b2c;
      --surface-2: #0f1727;
      --border: #223049;
      --border-strong: #33425e;
      --text: #e5eaf2;
      --text-2: #a3b1c6;
      --text-3: #8191a8;
      --primary: #5b8def;
      --primary-hover: #7aa3f5;
      --primary-soft: #17284a;
      --on-primary: #0b1220;
      --accent: #f0953f;
      --success: #4ade80;
      --success-soft: #123423;
      --warning: #fbbf24;
      --warning-soft: #3a2a0c;
      --danger: #f87171;
      --danger-hover: #fca5a5;
      --danger-soft: #3b1515;
      --info: #38bdf8;
      --info-soft: #0d2c3a;
      --nav-bg: #0a1424;
      --nav-text: #aab7ca;
      --nav-active: #ffffff;
      --nav-active-bg: #162843;
      --nav-hover-bg: #111f35;
      --nav-line: #1b2a42;
      --plate-border: #0f172a;
      --overlay: rgb(0 0 0 / 60%);
      --shadow-sm: none;
      --shadow-md: 0 4px 12px rgb(0 0 0 / 45%);
      --shadow-lg: 0 16px 40px rgb(0 0 0 / 60%);
    }
  }

  /* ------------------------------------------------------------ Grundlagen */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: var(--fs-base); line-height: var(--lh-base);
    font-variant-numeric: tabular-nums;
  }
  h1, h2, h3 { margin: 0; }
  h1 { font-size: var(--fs-lg); line-height: var(--lh-lg); font-weight: 600; }
  h2 { font-size: var(--fs-md); line-height: var(--lh-md); font-weight: 600; }
  h3 { font-size: var(--fs-base); line-height: var(--lh-base); font-weight: 600; }
  p { margin: 0; }
  a { color: var(--primary); }
  :focus-visible { outline: var(--ring) solid var(--primary); outline-offset: var(--ring); }
  [tabindex="-1"]:focus { outline: none; }
  .sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .sym { width: var(--sym); height: var(--sym); flex: none; }
  .gedaempft { color: var(--text-2); }
  .leiser { color: var(--text-3); }
  .klein { font-size: var(--fs-sm); line-height: var(--lh-sm); }
  .minus { color: var(--danger); }
  .plus { color: var(--success); }
  .kurz { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .zum-inhalt { position: absolute; left: var(--sp-2); top: var(--sp-2); z-index: 200; transform: translateY(-200%); }
  .zum-inhalt:focus { transform: none; }

  /* ------------------------------------------------------------ Knöpfe */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
    height: var(--ctl-h); padding: 0 var(--sp-4); border-radius: var(--r-sm);
    border: var(--line) solid transparent; background: transparent; color: var(--text);
    font: inherit; font-size: var(--fs-base); font-weight: 600; white-space: nowrap; cursor: pointer;
    text-decoration: none;
    transition: background-color var(--dur-fast) ease-out, border-color var(--dur-fast) ease-out, color var(--dur-fast) ease-out;
  }
  .btn .sym { width: var(--sym-sm); height: var(--sym-sm); }
  .btn.primaer { background: var(--primary); color: var(--on-primary); }
  .btn.primaer:hover { background: var(--primary-hover); }
  .btn.sekundaer { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
  .btn.sekundaer:hover { background: var(--surface-2); }
  .btn.leise { color: var(--primary); }
  .btn.leise:hover { background: var(--primary-soft); }
  .btn.gefahr { background: var(--danger); color: var(--on-primary); }
  .btn.gefahr:hover { background: var(--danger-hover); }
  .btn.klein { height: var(--ctl-h-sm); padding: 0 var(--sp-3); font-size: var(--fs-sm); }
  .btn.btn-sym { width: var(--sym-btn); height: var(--sym-btn); padding: 0; color: var(--text-2); }
  .btn.btn-sym .sym { width: var(--sym); height: var(--sym); }
  .btn.btn-sym:hover { background: var(--surface-2); color: var(--text); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.laedt { pointer-events: none; }
  .btn.laedt .sym { display: none; }
  .btn.laedt::before {
    content: ""; width: var(--sym-sm); height: var(--sym-sm); flex: none; border-radius: 50%;
    border: var(--ring) solid currentColor; border-right-color: transparent; animation: dreh .7s linear infinite;
  }
  @keyframes dreh { to { transform: rotate(360deg); } }

  /* ------------------------------------------------------------ Formulare */
  .feld { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
  .feld > label { font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: 600; color: var(--text); }
  .hilfe { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-3); }
  input, select, textarea {
    font: inherit; color: var(--text); width: 100%; min-width: 0; height: var(--ctl-h); padding: 0 var(--sp-3);
    background: var(--surface); border: var(--line) solid var(--border-strong); border-radius: var(--r-sm);
  }
  input:focus-visible, select:focus-visible { outline: var(--ring) solid var(--primary); outline-offset: 0; border-color: var(--primary); }
  input::placeholder { color: var(--text-3); }
  input[type="checkbox"] { width: var(--check); height: var(--check); padding: 0; margin: 0; accent-color: var(--primary); cursor: pointer; flex: none; }
  .formular-raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(var(--form-min), 100%), 1fr)); gap: var(--sp-4); }
  .formular-raster .breit { grid-column: 1 / -1; }
  .form-fuss { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: var(--sp-2); margin-top: var(--sp-5); }
  .form-fuss .links { margin-right: auto; }
  .fehlertext { display: flex; gap: var(--sp-2); align-items: flex-start; color: var(--danger); font-size: var(--fs-sm); line-height: var(--lh-sm); }
  .fehlertext:empty { display: none; }
  .fehlertext .sym { width: var(--sym-sm); height: var(--sym-sm); margin-top: var(--sp-half); }

  /* ------------------------------------------------------------ Rahmen: Seitenleiste und Inhalt */
  .shell { display: flex; min-height: 100vh; }
  .seite-spalte { flex: 0 0 var(--nav-w); background: var(--nav-bg); }
  .seite {
    width: var(--nav-w); position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: var(--sp-6);
    background: var(--nav-bg); color: var(--nav-text); padding: var(--sp-5) var(--sp-3) var(--sp-4);
  }
  .seite :focus-visible { outline-color: var(--nav-active); }
  .marke { display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-2); min-width: 0; }
  .marke-sym {
    display: grid; place-items: center; width: var(--sym-feld); height: var(--sym-feld); flex: none;
    border-radius: var(--r-sm); background: var(--accent); color: var(--nav-bg);
  }
  .marke-text { display: flex; flex-direction: column; min-width: 0; }
  .marke-name { color: var(--nav-active); font-weight: 600; font-size: var(--fs-base); line-height: var(--lh-base); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .marke-unter { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--nav-text); }
  .nav-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
  .nav-link {
    position: relative; display: flex; align-items: center; gap: var(--sp-3); height: var(--nav-item-h);
    padding: 0 var(--sp-3); border-radius: var(--r-sm); color: var(--nav-text); text-decoration: none; font-weight: 500;
    transition: background-color var(--dur-fast) ease-out, color var(--dur-fast) ease-out;
  }
  .nav-link:hover { background: var(--nav-hover-bg); color: var(--nav-active); }
  .nav-link[aria-current="page"] { background: var(--nav-active-bg); color: var(--nav-active); font-weight: 600; }
  .nav-link[aria-current="page"]::before {
    content: ""; position: absolute; left: 0; top: var(--sp-2); bottom: var(--sp-2); width: var(--line-accent);
    background: var(--accent); border-radius: 0 var(--line-accent) var(--line-accent) 0;
  }
  .nav-zahl {
    margin-left: auto; min-width: var(--sp-5); padding: 0 var(--sp-2); border-radius: var(--r-pill); text-align: center;
    font-size: var(--fs-xs); line-height: var(--lh-xs); font-weight: 600; background: var(--danger); color: var(--on-primary);
  }
  .seite-fuss { margin-top: auto; display: flex; flex-direction: column; gap: var(--sp-2); padding-top: var(--sp-4); border-top: var(--line) solid var(--nav-line); }
  .nutzer-knopf {
    display: flex; align-items: center; gap: var(--sp-3); width: 100%; padding: var(--sp-2); border: 0; border-radius: var(--r-sm);
    background: transparent; color: var(--nav-active); font: inherit; text-align: left; cursor: pointer;
  }
  .nutzer-knopf:hover { background: var(--nav-hover-bg); }
  .nutzer-knopf .sym { width: var(--sym-sm); height: var(--sym-sm); color: var(--nav-text); margin-left: auto; }
  .nutzer-text { display: flex; flex-direction: column; min-width: 0; }
  .nutzer-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nutzer-rolle { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--nav-text); }
  .thema-knopf {
    display: flex; align-items: center; gap: var(--sp-3); width: 100%; height: var(--nav-item-h); padding: 0 var(--sp-3);
    border: 0; border-radius: var(--r-sm); background: transparent; color: var(--nav-text); font: inherit; cursor: pointer;
  }
  .thema-knopf:hover { background: var(--nav-hover-bg); color: var(--nav-active); }
  .oben { display: none; }
  .schleier { display: none; }
  .haupt { flex: 1 1 auto; min-width: 0; padding: var(--sp-6); }
  .inhalt { max-width: var(--content-max); margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp-6); }

  @media (max-width: 899.98px) {
    .shell { display: block; }
    .oben {
      position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: var(--sp-2);
      height: var(--topbar-h); padding: 0 var(--sp-3); background: var(--nav-bg); color: var(--nav-active);
    }
    .oben .marke { padding: 0; }
    .oben .btn.btn-sym { color: var(--nav-active); }
    .oben .btn.btn-sym:hover { background: var(--nav-hover-bg); }
    .oben :focus-visible { outline-color: var(--nav-active); }
    .seite {
      position: fixed; inset: 0 auto 0 0; z-index: 60; height: 100%; width: min(var(--nav-w), 85vw);
      transform: translateX(-100%); visibility: hidden;
      transition: transform var(--dur) ease-out, visibility var(--dur);
    }
    body.nav-offen .seite { transform: none; visibility: visible; box-shadow: var(--shadow-lg); }
    body.nav-offen .schleier { display: block; position: fixed; inset: 0; z-index: 55; background: var(--overlay); }
    .haupt { padding: var(--sp-4); }
    .inhalt { gap: var(--sp-5); }
  }

  /* ------------------------------------------------------------ Kopfzeile eines Bereichs */
  .kopfzeile { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--sp-3) var(--sp-6); }
  .kopf-text { min-width: 0; flex: 1 1 20rem; }
  .kopf-unter { color: var(--text-2); margin-top: var(--sp-1); max-width: 72ch; }
  .kopf-aktion { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

  /* ------------------------------------------------------------ Karten */
  .karte {
    background: var(--surface); border: var(--line) solid var(--border); border-radius: var(--r-md);
    box-shadow: var(--shadow-sm); min-width: 0;
  }
  .karte-kopf {
    display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap;
    padding: var(--sp-4) var(--sp-5); border-bottom: var(--line) solid var(--border);
  }
  .karte-kopf h2 { display: flex; align-items: center; gap: var(--sp-2); }
  .karte-text { color: var(--text-2); font-size: var(--fs-sm); line-height: var(--lh-sm); margin-top: var(--sp-1); }
  .karte-inhalt { padding: var(--sp-5); }
  .karte-fuss { padding: var(--sp-3) var(--sp-5); border-top: var(--line) solid var(--border); display: flex; justify-content: flex-end; }
  .tabelle-karte { overflow: hidden; }
  .raster-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); align-items: start; }
  @media (max-width: 1099.98px) { .raster-2 { grid-template-columns: minmax(0, 1fr); } }
  .raster-2 > .ganz { grid-column: 1 / -1; }

  /* ------------------------------------------------------------ Plaketten, Töne */
  .ton-success { background: var(--success-soft); color: var(--success); }
  .ton-warning { background: var(--warning-soft); color: var(--warning); }
  .ton-danger { background: var(--danger-soft); color: var(--danger); }
  .ton-info { background: var(--info-soft); color: var(--info); }
  .ton-primary { background: var(--primary-soft); color: var(--primary); }
  .ton-neutral { background: var(--surface-2); color: var(--text-2); }
  .plakette {
    display: inline-flex; align-items: center; gap: var(--sp-2); padding: var(--sp-half) var(--sp-2);
    border-radius: var(--r-pill); font-size: var(--fs-xs); line-height: var(--lh-xs); font-weight: 500; white-space: nowrap;
  }
  .plakette.ton-neutral { border: var(--line) solid var(--border); }
  .plakette::before { content: ""; width: var(--dot); height: var(--dot); border-radius: 50%; background: currentColor; flex: none; }
  .plakette.ohne-punkt::before { display: none; }

  /* ------------------------------------------------------------ Kennzeichen */
  .kz {
    display: inline-flex; align-items: stretch; flex: none; overflow: hidden;
    background: var(--plate-bg); color: var(--plate-text); border: var(--line-plate) solid var(--plate-border); border-radius: var(--r-sm);
    font-family: var(--font-plate); font-weight: 600; font-size: var(--fs-sm); line-height: 1; letter-spacing: .04em; white-space: nowrap;
  }
  .kz-eu {
    display: flex; align-items: flex-end; justify-content: center; width: var(--sp-3); padding-bottom: var(--sp-half);
    background: var(--plate-eu); color: var(--plate-eu-text); font-size: var(--fs-2xs); letter-spacing: 0;
  }
  .kz-text { padding: var(--sp-1) var(--sp-2); }
  .kz.gross { font-size: var(--fs-md); }
  .kz.gross .kz-eu { width: var(--sp-4); padding-bottom: var(--sp-1); }
  .kz.gross .kz-text { padding: var(--sp-2) var(--sp-3); }

  /* ------------------------------------------------------------ Initialen */
  .avatar {
    display: inline-grid; place-items: center; width: var(--avatar); height: var(--avatar); flex: none; border-radius: 50%;
    background: var(--primary-soft); color: var(--primary); font-size: var(--fs-xs); line-height: 1; font-weight: 600; position: relative;
  }
  .avatar.klein { width: var(--avatar-sm); height: var(--avatar-sm); font-size: var(--fs-2xs); }
  .seite .avatar { background: var(--nav-active-bg); color: var(--nav-active); }
  .avatar .online-punkt {
    position: absolute; right: calc(var(--sp-half) * -1); bottom: calc(var(--sp-half) * -1); width: calc(var(--dot) + var(--sp-1)); height: calc(var(--dot) + var(--sp-1));
    border-radius: 50%; border: var(--line-plate) solid var(--surface); background: var(--text-3);
  }
  .avatar .online-punkt.an { background: var(--success); }

  /* ------------------------------------------------------------ Kennzahl-Kacheln */
  .kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(var(--kachel-min), 100%), 1fr)); gap: var(--sp-4); }
  .kachel {
    display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4) var(--sp-5); min-width: 0;
    background: var(--surface); border: var(--line) solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-sm);
    color: inherit; text-decoration: none; transition: border-color var(--dur-fast) ease-out;
  }
  a.kachel:hover { border-color: var(--border-strong); }
  .kachel-kopf { display: flex; align-items: center; gap: var(--sp-3); color: var(--text-2); font-size: var(--fs-sm); line-height: var(--lh-sm); min-width: 0; }
  .kachel-sym { display: grid; place-items: center; width: var(--sym-feld); height: var(--sym-feld); border-radius: var(--r-sm); flex: none; }
  .kachel-sym .sym { width: var(--sym-sm); height: var(--sym-sm); }
  .kachel-wert { font-size: var(--fs-xl); line-height: var(--lh-xl); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kachel-zusatz { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-2); }
  @media (max-width: 899.98px) {
    .kachel { padding: var(--sp-3) var(--sp-4); }
    .kachel-wert { font-size: var(--fs-lg); line-height: var(--lh-lg); }
  }

  /* ------------------------------------------------------------ Listen in Karten (Übersicht) */
  .liste { list-style: none; margin: 0; padding: 0; }
  .liste > li { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5); border-bottom: var(--line) solid var(--border); min-width: 0; }
  .liste > li:last-child { border-bottom: 0; }
  .liste-mitte { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .liste-titel { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liste-unter { color: var(--text-2); font-size: var(--fs-sm); line-height: var(--lh-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liste-rechts { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: var(--sp-1); text-align: right; }
  .liste .betrag { font-weight: 600; white-space: nowrap; }
  @media (max-width: 599.98px) {
    .nur-breit { display: none; }
    .liste-titel, .liste-unter { white-space: normal; }
  }
  .ue-raster { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--sp-4); align-items: start; }
  .spalte { display: flex; flex-direction: column; gap: var(--sp-4); min-width: 0; }
  @media (max-width: 1099.98px) { .ue-raster { grid-template-columns: minmax(0, 1fr); } }
  .fahrt { display: inline-flex; align-items: center; gap: var(--sp-1); color: var(--warning); font-weight: 600; }
  .fahrt .sym { width: var(--sym-sm); height: var(--sym-sm); }

  /* ------------------------------------------------------------ Leerer Zustand und Hinweise */
  .leer { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); padding: var(--sp-8) var(--sp-5); text-align: center; color: var(--text-3); }
  .leer .sym { width: var(--sp-8); height: var(--sp-8); }
  .leer p { color: var(--text-2); max-width: 46ch; }
  .hinweis { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); border: var(--line) solid var(--border); background: var(--surface); color: var(--text-2); }
  .hinweis .sym { color: var(--info); margin-top: var(--sp-half); }
  .hinweis.warnung .sym { color: var(--warning); }
  .hinweis.gefahr .sym { color: var(--danger); }
  .fussnote { color: var(--text-3); font-size: var(--fs-sm); line-height: var(--lh-sm); max-width: 100ch; }

  /* ------------------------------------------------------------ Fuhrpark */
  .pillen { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .pille {
    display: inline-flex; align-items: center; gap: var(--sp-2); height: var(--ctl-h-sm); padding: 0 var(--sp-3);
    border: var(--line) solid var(--border-strong); border-radius: var(--r-pill); background: var(--surface); color: var(--text-2);
    font: inherit; font-size: var(--fs-sm); font-weight: 600; cursor: pointer;
  }
  .pille:hover { color: var(--text); }
  .pille[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .pille-zahl { font-size: var(--fs-xs); color: inherit; opacity: .8; }
  .lkw-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--card-min), 100%), 1fr)); gap: var(--sp-4); }
  .lkw-karte { display: flex; flex-direction: column; }
  .lk-kopf { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-4) var(--sp-4) 0; min-width: 0; }
  .lk-name { min-width: 0; display: flex; flex-direction: column; padding: var(--sp-3) var(--sp-4) var(--sp-3); }
  .lk-modell { font-weight: 600; font-size: var(--fs-md); line-height: var(--lh-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lk-unter { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lk-werte { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--sp-3); margin: 0 var(--sp-4); padding: var(--sp-3) 0; border-top: var(--line) solid var(--border); }
  .wert { min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
  .wert-titel { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-2); }
  .wert-zahl { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wert-unter { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .schaden-zeile { display: flex; align-items: center; gap: var(--sp-2); }
  .balken { position: relative; flex: 1 1 auto; min-width: var(--sp-6); height: var(--bar-h); border-radius: var(--r-pill); background: var(--border); }
  .balken > .fuellung { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--r-pill); background: var(--success); }
  .balken.warning > .fuellung { background: var(--warning); }
  .balken.danger > .fuellung { background: var(--danger); }
  .balken > .grenze { position: absolute; top: calc(var(--sp-half) * -1); bottom: calc(var(--sp-half) * -1); width: var(--sp-half); background: var(--text-3); border-radius: var(--sp-half); }
  .text-success { color: var(--success); } .text-warning { color: var(--warning); } .text-danger { color: var(--danger); }
  .lk-fahrer { display: flex; align-items: center; gap: var(--sp-3); margin: 0 var(--sp-4); padding: var(--sp-3) 0; border-top: var(--line) solid var(--border); min-width: 0; }
  .lk-fahrer-text { display: flex; flex-direction: column; min-width: 0; }
  .lk-fahrer-name { font-weight: 600; }
  .lk-hinweise { display: flex; flex-direction: column; gap: var(--sp-2); margin: 0 var(--sp-4) var(--sp-3); }
  .lk-hinweis { display: flex; gap: var(--sp-2); align-items: flex-start; font-size: var(--fs-sm); line-height: var(--lh-sm); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); }
  .lk-hinweis .sym { width: var(--sym-sm); height: var(--sym-sm); margin-top: var(--sp-half); }
  .lk-fuss {
    margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
    padding: var(--sp-3) var(--sp-4); border-top: var(--line) solid var(--border); background: var(--surface-2);
    border-radius: 0 0 var(--r-md) var(--r-md); min-height: calc(var(--ctl-h) + var(--sp-6));
  }
  .lk-fuss-text { color: var(--text-2); font-size: var(--fs-sm); line-height: var(--lh-sm); min-width: 0; }
  .lk-aktionen { display: flex; align-items: center; gap: var(--sp-1); margin-left: auto; flex: none; }
  .abgaenge > summary {
    cursor: pointer; display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-5);
    font-weight: 600; color: var(--text-2); list-style: none;
  }
  .abgaenge > summary::-webkit-details-marker { display: none; }
  .abgaenge > summary .sym { width: var(--sym-sm); height: var(--sym-sm); transition: transform var(--dur-fast) ease-out; }
  .abgaenge[open] > summary .sym { transform: rotate(180deg); }
  .abgaenge[open] > summary { border-bottom: var(--line) solid var(--border); }
  .abgaenge .tabelle td { color: var(--text-2); }

  /* ------------------------------------------------------------ Menü "Mehr" */
  .menue { position: relative; display: inline-flex; }
  .menue-liste {
    position: absolute; right: 0; top: calc(100% + var(--sp-1)); z-index: 40; min-width: var(--menu-w);
    padding: var(--sp-1); background: var(--surface); border: var(--line) solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-md);
  }
  .menue-liste.nach-oben { top: auto; bottom: calc(100% + var(--sp-1)); left: 0; right: 0; min-width: 0; }
  .menue-liste[hidden] { display: none; }
  .menue-eintrag {
    display: flex; align-items: center; gap: var(--sp-2); width: 100%; padding: var(--sp-2) var(--sp-3); border: 0; border-radius: var(--r-sm);
    background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; white-space: nowrap;
  }
  .menue-eintrag .sym { width: var(--sym-sm); height: var(--sym-sm); color: var(--text-2); }
  .menue-eintrag:hover, .menue-eintrag:focus { background: var(--surface-2); outline: none; }
  .menue-eintrag:focus-visible { outline: var(--ring) solid var(--primary); outline-offset: calc(var(--ring) * -1); }
  .menue-eintrag.gefahr, .menue-eintrag.gefahr .sym { color: var(--danger); }
  .menue-trenner { height: var(--line); background: var(--border); margin: var(--sp-1) 0; }
  .nutzer-menue { display: flex; }

  /* ------------------------------------------------------------ Tabellen */
  .tabelle-rahmen { overflow-x: auto; position: relative; }
  .tabelle { width: 100%; border-collapse: separate; border-spacing: 0; }
  .tabelle.breit { min-width: var(--tab-min); }
  .tabelle.mittel { min-width: var(--tab-min-sm); }
  .tabelle th {
    height: var(--head-h); padding: 0 var(--sp-4); text-align: left; white-space: nowrap;
    background: var(--surface-2); color: var(--text-2); font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: 600;
    border-bottom: var(--line) solid var(--border);
  }
  .tabelle td { height: var(--row-h); padding: var(--sp-2) var(--sp-4); border-bottom: var(--line) solid var(--border); vertical-align: middle; }
  .tabelle tbody tr:last-child > td { border-bottom: 0; }
  .tabelle tbody tr:hover > td { background: var(--surface-2); }
  .tabelle tr.gewaehlt > td, .tabelle tr.gewaehlt:hover > td { background: var(--primary-soft); }
  .tabelle th, .tabelle td { padding-left: var(--sp-3); padding-right: var(--sp-3); }
  .tabelle th:first-child, .tabelle td:first-child { padding-left: var(--sp-5); }
  .tabelle th:last-child, .tabelle td:last-child { padding-right: var(--sp-5); }
  .tabelle .zahl { text-align: right; white-space: nowrap; }
  .tabelle .eng { width: 1%; white-space: nowrap; }
  .tabelle input { height: var(--ctl-h-sm); }
  .zelle-name { display: flex; align-items: center; gap: var(--sp-3); white-space: nowrap; }
  .zelle-unter { display: block; font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-3); }
  .zelle-unter.text-success { color: var(--success); }
  .zelle-unter.text-warning { color: var(--warning); }

  /* ------------------------------------------------------------ Kassenbuch */
  .filterleiste { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--sp-3) var(--sp-4); padding: var(--sp-4) var(--sp-5); }
  .filterleiste .feld { flex: 1 1 9rem; max-width: 14rem; }
  .filterleiste .feld.art { max-width: 18rem; flex-basis: 12rem; }
  .schnellwahl { display: flex; flex-wrap: wrap; gap: var(--sp-2); flex: 1 1 100%; }
  .kb-tabelle td.wann { white-space: nowrap; width: 1%; }
  .wann-zeit { font-weight: 600; }
  .wann-tag { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-3); }
  .kb-tabelle .wahl-zelle { width: 1%; padding-right: 0; }
  .buchung { display: flex; gap: var(--sp-3); align-items: flex-start; min-width: 0; }
  .art-sym { display: grid; place-items: center; width: var(--sym-feld); height: var(--sym-feld); flex: none; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-2); border: var(--line) solid var(--border); }
  .art-sym .sym { width: var(--sym-sm); height: var(--sym-sm); }
  .buchung-text { min-width: 0; display: flex; flex-direction: column; gap: var(--sp-half); }
  .buchung-titel { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); font-weight: 600; }
  .buchung-unter { color: var(--text-2); font-size: var(--fs-sm); line-height: var(--lh-sm); overflow-wrap: anywhere; }
  .storno-hinweis { color: var(--warning); font-size: var(--fs-xs); line-height: var(--lh-xs); }
  .betrag { font-weight: 600; }
  tr.storniert .durch { text-decoration: line-through; color: var(--text-3); }
  tr.storniert .art-sym { opacity: .6; }
  tr.storno > td { background: var(--warning-soft); }
  tr.storno:hover > td { background: var(--warning-soft); }
  .gruppe-knopf {
    display: inline-flex; align-items: center; gap: var(--sp-2); padding: 0; border: 0; background: none;
    color: var(--primary); font: inherit; font-weight: 600; cursor: pointer; text-align: left;
  }
  .gruppe-knopf .sym { width: var(--sym-sm); height: var(--sym-sm); transition: transform var(--dur-fast) ease-out; }
  .gruppe-knopf[aria-expanded="true"] .sym { transform: rotate(90deg); }
  td.innen { padding: 0 var(--sp-4) var(--sp-3); background: var(--surface-2); }
  .tabelle tbody tr:hover > td.innen { background: var(--surface-2); }
  td.innen .tabelle { background: var(--surface); border: var(--line) solid var(--border); border-radius: var(--r-sm); }
  td.innen .tabelle td { height: auto; padding: var(--sp-2) var(--sp-3); }
  td.innen .tabelle th { padding: 0 var(--sp-3); height: var(--ctl-h-sm); }
  .kauf { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-top: var(--sp-1); }
  .kauf select { width: auto; max-width: 100%; height: var(--ctl-h-sm); }
  .tabelle-hinweis { padding: var(--sp-2) var(--sp-5); color: var(--text-2); font-size: var(--fs-sm); line-height: var(--lh-sm); background: var(--surface-2); border-bottom: var(--line) solid var(--border); }
  .auswahl-leiste {
    position: sticky; bottom: var(--sp-4); z-index: 20; align-self: center; width: min(100%, 860px);
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); padding: var(--sp-3) var(--sp-4);
    background: var(--surface); border: var(--line) solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow-lg);
  }
  .auswahl-leiste[hidden] { display: none; }
  .auswahl-zahl { font-weight: 600; }
  .auswahl-summe { color: var(--text-2); font-size: var(--fs-sm); margin-right: auto; }
  .ungeklaert-liste li { flex-wrap: wrap; }
  /* Schmal: jede Buchung als Block, Beträge rechts mit Beschriftung */
  @media (max-width: 699.98px) {
    .tabelle.kb-tabelle, .kb-tabelle > tbody { display: block; min-width: 0; width: 100%; }
    .kb-tabelle > thead { display: none; }
    .kb-tabelle > tbody > tr {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "wann kasse" "haupt lohn";
      gap: var(--sp-1) var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: var(--line) solid var(--border);
    }
    .kb-tabelle.mit-wahl > tbody > tr { grid-template-columns: var(--check) minmax(0, 1fr) auto; grid-template-areas: "wahl wann kasse" "wahl haupt lohn"; }
    .kb-tabelle > tbody > tr:last-child { border-bottom: 0; }
    .kb-tabelle > tbody > tr > td,
    .kb-tabelle > tbody > tr:hover > td,
    .kb-tabelle > tbody > tr.gewaehlt > td,
    .kb-tabelle > tbody > tr.storno > td { display: block; height: auto; padding: 0; border: 0; background: transparent; }
    .kb-tabelle > tbody > tr.gewaehlt { background: var(--primary-soft); }
    .kb-tabelle > tbody > tr.storno { background: var(--warning-soft); }
    .kb-tabelle > tbody > tr > td.wahl-zelle { grid-area: wahl; padding-top: var(--sp-half); }
    .kb-tabelle > tbody > tr > td.wann { grid-area: wann; display: flex; gap: var(--sp-2); align-items: baseline; width: auto; }
    .kb-tabelle > tbody > tr > td.haupt { grid-area: haupt; }
    .kb-tabelle > tbody > tr > td.kasse { grid-area: kasse; }
    .kb-tabelle > tbody > tr > td.lohn { grid-area: lohn; }
    .kb-tabelle > tbody > tr > td.zahl:not(:empty)::before { content: attr(data-label); display: block; font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-3); font-weight: 400; }
    .kb-tabelle > tbody > tr.gruppe-innen { display: block; padding: 0 var(--sp-4) var(--sp-3); }
    .kb-tabelle > tbody > tr.gruppe-innen > td.innen { background: transparent; }
    .kb-tabelle .art-sym { display: none; }
  }

  /* ------------------------------------------------------------ Büro */
  .code { font-family: var(--font-plate); font-size: var(--fs-xl); line-height: var(--lh-xl); font-weight: 700; letter-spacing: .12em; }
  .einladung { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4) var(--sp-6); }
  .einladung .code { padding: var(--sp-2) var(--sp-4); border: var(--line) dashed var(--border-strong); border-radius: var(--r-sm); background: var(--surface-2); }
  .budget-wert { font-size: var(--fs-xl); line-height: var(--lh-xl); font-weight: 700; }
  .budget-stand { display: flex; flex-direction: column; gap: var(--sp-2); }
  .stufen td:first-child { font-weight: 600; }

  /* ------------------------------------------------------------ Dialog */
  dialog.dlg {
    width: min(var(--dialog-w), calc(100vw - 2 * var(--sp-4))); max-width: none; max-height: calc(100vh - 2 * var(--sp-4)); padding: 0;
    border: var(--line) solid var(--border); border-radius: var(--r-md); background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg);
  }
  dialog.dlg::backdrop { background: var(--overlay); }
  .dlg-kopf { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-4) var(--sp-4) 0 var(--sp-5); }
  .dlg-inhalt { display: flex; flex-direction: column; gap: var(--sp-4); padding: var(--sp-4) var(--sp-5) var(--sp-5); }
  .dlg-inhalt > p { color: var(--text-2); }
  .dlg-fuss { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--sp-2); padding: var(--sp-3) var(--sp-5); border-top: var(--line) solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--r-md) var(--r-md); }
  .dlg-block { display: flex; flex-direction: column; gap: var(--sp-2); align-items: flex-start; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-sm); background: var(--surface-2); border: var(--line) solid var(--border); }
  .dlg-summe { display: flex; gap: var(--sp-6); flex-wrap: wrap; }
  .dlg-summe strong { display: block; font-size: var(--fs-md); }

  /* ------------------------------------------------------------ Meldungen */
  #toasts {
    position: fixed; right: var(--sp-6); bottom: var(--sp-6); z-index: 100; display: flex; flex-direction: column; gap: var(--sp-2);
    width: min(var(--toast-w), calc(100vw - 2 * var(--sp-4))); pointer-events: none;
  }
  .toast {
    pointer-events: auto; display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-3) var(--sp-2) var(--sp-3) var(--sp-4);
    background: var(--surface); color: var(--text); border: var(--line) solid var(--border); border-left: var(--line-toast) solid var(--success);
    border-radius: var(--r-md); box-shadow: var(--shadow-md); animation: rein var(--dur) ease-out;
  }
  .toast > .sym { color: var(--success); margin-top: var(--sp-half); }
  .toast.fehler { border-left-color: var(--danger); }
  .toast.fehler > .sym { color: var(--danger); }
  .toast.info { border-left-color: var(--info); }
  .toast.info > .sym { color: var(--info); }
  .toast-text { flex: 1 1 auto; padding-top: var(--sp-half); }
  @keyframes rein { from { opacity: 0; transform: translateY(var(--sp-2)); } }
  @media (max-width: 899.98px) { #toasts { right: var(--sp-4); bottom: var(--sp-4); } }

  /* ------------------------------------------------------------ Anmeldung und Firmenwahl */
  .aussen { min-height: 100vh; display: flex; flex-direction: column; }
  .aussen-kopf { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; padding: var(--sp-3) var(--sp-6); background: var(--nav-bg); color: var(--nav-active); }
  .aussen-kopf :focus-visible { outline-color: var(--nav-active); }
  .aussen-kopf .marke { padding: 0; }
  .aussen-aktionen { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
  .aussen-aktionen .thema-knopf, .aussen-aktionen .btn.leise { width: auto; height: var(--ctl-h); color: var(--nav-text); }
  .aussen-aktionen .btn.leise:hover { background: var(--nav-hover-bg); color: var(--nav-active); }
  .aussen-wer { display: inline-flex; align-items: center; gap: var(--sp-2); margin-right: var(--sp-2); }
  .aussen-wer .avatar { background: var(--nav-active-bg); color: var(--nav-active); }
  .aussen-inhalt { flex: 1 1 auto; padding: var(--sp-10) var(--sp-4); }
  .anmelde-karte { width: min(var(--login-w), 100%); margin: 0 auto; }
  .anmelde-kopf { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-6) var(--sp-6) 0; }

function sym(name, klasse) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.75");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  svg.setAttribute("class", "sym" + (klasse ? " " + klasse : ""));
  for (const [art, ...w] of SYMBOLE[name] || []) {
    const el = document.createElementNS(NS, art === "punkt" ? "circle" : art);
    if (art === "path") el.setAttribute("d", w[0]);
    else if (art === "circle") { el.setAttribute("cx", w[0]); el.setAttribute("cy", w[1]); el.setAttribute("r", w[2]); }
    else if (art === "rect") {
      el.setAttribute("x", w[0]); el.setAttribute("y", w[1]); el.setAttribute("width", w[2]); el.setAttribute("height", w[3]);
      if (w[4]) el.setAttribute("rx", w[4]);
    } else if (art === "punkt") {
      el.setAttribute("cx", w[0]); el.setAttribute("cy", w[1]); el.setAttribute("r", "1.3");
      el.setAttribute("fill", "currentColor"); el.setAttribute("stroke", "none");
    }
    svg.append(el);
  }
  return svg;
}

class ApiFehler extends Error { constructor(status, text) { super(text); this.status = status; } }

async function api(methode, pfad, daten) {
  const kopf = {};
  if (zustand.token) kopf.Authorization = "Bearer " + zustand.token;
  if (daten !== undefined) kopf["Content-Type"] = "application/json";
  let antwort;
  try {
    antwort = await fetch(pfad, { method: methode, headers: kopf, body: daten === undefined ? undefined : JSON.stringify(daten) });
  } catch {
    throw new ApiFehler(0, "Der Server antwortet nicht. Läuft er noch?");
  }
  const json = await antwort.json().catch(() => null);
  if (!antwort.ok) throw new ApiFehler(antwort.status, (json && json.error) || "Die Anfrage ist fehlgeschlagen (" + antwort.status + ")");
  return json;
}

/** Meldung unten rechts. Erfolg verschwindet nach 4 Sekunden, Fehler nach 8. */
function melde(text, fehler) {
  const box = $("toasts");
  const art = fehler === true ? "fehler" : fehler || "erfolg";
  const toast = h("div", { class: "toast " + art, role: art === "fehler" ? "alert" : "status" },
    sym(art === "fehler" ? "warnung" : art === "info" ? "info" : "haken"),
    h("div", { class: "toast-text" }, text),
    h("button", { type: "button", class: "btn btn-sym klein", "aria-label": "Meldung schließen", onclick: () => toast.remove() }, sym("schliessen")));
  box.append(toast);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => toast.remove(), art === "fehler" ? 8000 : 4000);
}

/** Knopf in den Ladezustand setzen: Kreisel statt Symbol, kein zweiter Klick. */
function laedt(knopf, an) {

  if (an) knopf.setAttribute("aria-busy", "true"); else knopf.removeAttribute("aria-busy");
}

/** Führt eine Aktion aus und zeigt Fehler an. Bei abgelaufener Anmeldung geht es zurück zum Anmelden. */
async function versuche(aktion, knopf) {
  laedt(knopf, true);
  try {
    await aktion();
  } catch (e) {
    if (e instanceof ApiFehler && e.status === 401 && zustand.token) {
      abmeldenLokal();
      melde("Deine Anmeldung ist abgelaufen. Melde dich neu an.", true);
    } else {

    }

    laedt(knopf, false);
  }
}

    ? h("button", { type: "button", class: opt.ausloeserKlasse, "aria-haspopup": "menu", "aria-expanded": "false", "data-k": opt.k || null, title: opt.label || null }, opt.ausloeser)
    : h("button", { type: "button", class: "btn btn-sym", "aria-label": opt.label || "Mehr", title: opt.label || "Mehr",
        "aria-haspopup": "menu", "aria-expanded": "false", "data-k": opt.k || null }, sym("mehr"));
  const wrap = h("div", { class: "menue" + (opt.klasse ? " " + opt.klasse : "") }, knopf, liste);
  const m = { wrap, knopf, liste };
  const punkte = () => [...liste.querySelectorAll('[role="menuitem"]')];
  const oeffne = (letzter) => {
    schliesseMenue(false);
    liste.hidden = false;
    knopf.setAttribute("aria-expanded", "true");
    offenesMenue = m;
    const p = punkte();
    if (p.length) (letzter ? p[p.length - 1] : p[0]).focus();
  };
  knopf.addEventListener("click", () => (offenesMenue === m ? schliesseMenue(true) : oeffne()));
  knopf.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); oeffne(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); oeffne(true); }
  });
  liste.addEventListener("keydown", (e) => {
    const p = punkte();
    const i = p.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); p[(i + 1) % p.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); p[(i - 1 + p.length) % p.length].focus(); }
    else if (e.key === "Home") { e.preventDefault(); p[0].focus(); }
    else if (e.key === "End") { e.preventDefault(); p[p.length - 1].focus(); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); schliesseMenue(true); }
    else if (e.key === "Tab") schliesseMenue(false);

  const eintrag = (x) => h("button", { type: "button", role: "menuitem", tabindex: "-1", class: "menue-eintrag" + (x.gefahr ? " gefahr" : ""),
    onclick: () => { schliesseMenue(true); x.aktion(knopf); } }, x.sym ? sym(x.sym) : null, x.text);
  const normal = eintraege.filter((x) => !x.gefahr);
  const gefahr = eintraege.filter((x) => x.gefahr);
  liste.append(...normal.map(eintrag));
  if (normal.length && gefahr.length) liste.append(h("div", { class: "menue-trenner", role: "separator" }));
  liste.append(...gefahr.map(eintrag));
  return wrap;
}

/** Öffnet einen Dialog. `baue(d)` liefert den Inhalt. d.zu() schließt, d.lauf() führt eine Aktion aus und zeigt Fehler im Dialog. */
function oeffneDialog(titel, baue) {
  schliesseMenue(false);
  const vorher = document.activeElement;
  const vorherK = vorher && vorher.dataset ? vorher.dataset.k : null;
  const id = "d" + Math.random().toString(36).slice(2, 8);
  const dialog = h("dialog", { class: "dlg", "aria-labelledby": id });
  const fehler = h("p", { class: "fehlertext", role: "alert" });
  const d = {
    dialog, fehler,
    zu() { if (dialog.open) dialog.close(); },
    async lauf(aktion, knopf) {
      fehler.replaceChildren();
      laedt(knopf, true);
      try {
        await aktion();
      } catch (err) {
        if (err instanceof ApiFehler && err.status === 401) { d.zu(); abmeldenLokal(); melde("Deine Anmeldung ist abgelaufen. Melde dich neu an.", true); }
        else fehler.replaceChildren(sym("warnung"), h("span", {}, err.message || String(err)));
      } finally {
        laedt(knopf, false);
      }
    },
  };
  dialog.addEventListener("close", () => {
    dialog.remove();
    const ziel = vorher && vorher.isConnected ? vorher
      : vorherK ? document.querySelector('[data-k="' + CSS.escape(vorherK) + '"]') : null;
    if (ziel) ziel.focus();
  });
  dialog.append(
    h("div", { class: "dlg-kopf" }, h("h2", { id }, titel),
      h("button", { type: "button", class: "btn btn-sym", "aria-label": "Dialog schließen", title: "Schließen", onclick: () => d.zu() }, sym("schliessen"))),
    ...[].concat(baue(d)));
  document.body.append(dialog);
  dialog.showModal();
  const erstes = dialog.querySelector("[data-fokus]") || dialog.querySelector(".dlg-inhalt input, .dlg-inhalt select");
  if (erstes) { erstes.focus(); if (erstes.dataset.fokus === "markieren" && erstes.select) erstes.select(); }
  return d;
}

/** Dialog mit Formular: Text, Felder, Fehler, unten Abbrechen und Bestätigen. */
function dialogFormular(titel, o) {
  return oeffneDialog(titel, (d) => h("form", { onsubmit: (ev) => { ev.preventDefault(); d.lauf(() => o.senden(d), ev.submitter); } },
    h("div", { class: "dlg-inhalt" },
      (o.text || []).filter(Boolean).map((t) => (typeof t === "string" ? h("p", {}, t) : t)),
      o.felder || [],
      o.extra ? o.extra(d) : null,
      d.fehler),
    h("div", { class: "dlg-fuss" },
      h("button", { type: "button", class: "btn leise", onclick: () => d.zu() }, "Abbrechen"),
      h("button", { class: "btn " + (o.gefahr ? "gefahr" : "primaer") }, o.knopf))));
}

// ---------------------------------------------------------------- Firma laden

/** Beginn eines lokalen Tags wie "2026-11-16" in Unix-Sekunden, mit `plus` Tagen später. */
function tagBeginn(tagText, plus) {
  const [y, m, d] = tagText.split("-").map(Number);
  return Math.floor(new Date(y, m - 1, d + (plus || 0)).getTime() / 1000);
}

/** Zeitraum des Kassenbuchs als Teil der Adresse: von Mitternacht bis Mitternacht nach "bis". */
function bereichAnfrage() {
  const f = zustand.filter;
  let q = "";
  if (f.von) q += "&from=" + tagBeginn(f.von);
  if (f.bis) q += "&to=" + tagBeginn(f.bis, 1);
  return q;
}

/** So viele Buchungen holt das Kassenbuch höchstens, mit Zeitraum mehr. */
const buchGrenze = () => (bereichAnfrage() ? 500 : 200);

async function ladeFirma() {
  const id = zustand.firmaId;
  const bereich = bereichAnfrage();
  const woche = Math.floor(Date.now() / 1000) - 7 * 86400;
  const [firma, lkw, buch, laeufe, letzte] = await Promise.all([
    api("GET", "/api/companies/" + id),
    api("GET", "/api/companies/" + id + "/trucks"),
    api("GET", "/api/companies/" + id + "/ledger?limit=" + buchGrenze() + bereich),
    api("GET", "/api/companies/" + id + "/payrolls?limit=60" + bereich),
    // Für die Übersicht: Buchungen der letzten 7 Tage, unabhängig vom Zeitraum des Kassenbuchs
    api("GET", "/api/companies/" + id + "/ledger?limit=500&from=" + woche),
  ]);
  const chef = firma.your_role === "chef";
  const [ungeklaert, abgelehnt, vorschlag] = chef ? await Promise.all([
    api("GET", "/api/companies/" + id + "/unexplained").then((r) => r.entries),
    api("GET", "/api/companies/" + id + "/rejected-events?limit=50").then((r) => r.entries),
    api("GET", "/api/companies/" + id + "/plate-suggestion").then((r) => r.plate),
  ]) : [[], [], null];
  // Inzwischen eine andere Firma oder ein anderer Zeitraum: Diese Antwort ist veraltet
  if (id !== zustand.firmaId || bereich !== bereichAnfrage()) return;
  zustand.firma = firma; zustand.lkw = lkw.trucks; zustand.buch = buch; zustand.woche = letzte.entries;
  zustand.laeufe = laeufe.payrolls; zustand.erlasse = laeufe.claim_waivers || [];
  zustand.ungeklaert = ungeklaert; zustand.abgelehnt = abgelehnt;
  zustand.vorschlag = vorschlag;
  // Was inzwischen storniert ist, fällt aus der Auswahl
  for (const e of buch.entries) if (!e.reversible) zustand.auswahl.delete(e.id);
  for (const l of laeufe.payrolls) for (const x of l.lines) if (x.reversed_by != null) zustand.auswahl.delete(x.entry_id);
}

async function oeffneFirma(id) {
  clearInterval(takt);
  zustand.firmaId = id; zustand.verknuepfen = null; zustand.fuhrparkFilter = "alle";
  zustand.auswahl = new Map(); zustand.filter = { von: "", bis: "", art: "" };
  await ladeFirma();
  speicher.set("firma", String(id));
  baueRahmen();
  zeigeAnsicht(false);
  takt = setInterval(() => { if (!document.hidden) auffrischen(true); }, 5000);
}

/** Holt neue Daten und zeichnet nur die Teile neu, die sich geändert haben. */
async function auffrischen(still) {
  try {
    await ladeFirma();
    zeichneDaten();
  } catch (e) {
    if (e instanceof ApiFehler && e.status === 401) { abmeldenLokal(); melde("Deine Anmeldung ist abgelaufen. Melde dich neu an.", true); }
    else if (!still) throw e;
  }
}

function zeichneDaten() {
  if (rahmenModus !== "innen" || !zustand.firma) return;
  if (ansichtAusAdresse() !== zustand.ansicht) return zeigeAnsicht(false);
  zeichneNav();
  zeichneAnsicht();
}

// ---------------------------------------------------------------- Gemeinsame Helfer der Bereiche

const aktiveLkw = () => zustand.lkw.filter((t) => !t.retired);
const ichSelbst = () => zustand.firma.members.find((m) => m.user_id === zustand.ich.user_id);

/** Das eigene gemeldete Firmenprofil, oder null. */
function meinProfil() {
  const ich = zustand.firma && ichSelbst();
  return (ich && ich.profile_name) || null;
}

/** Status eines Lkw als [Text, Ton, Filter]. */
function lkwStatus(t) {
  if (t.retired) return [t.retired.reason === "verkauft" ? "verkauft" : "ausgemustert", "neutral", "raus"];
  if (t.leased_by) return [t.driving ? "unterwegs" : "verliehen", "warning", "unterwegs"];
  if (t.in_workshop) return ["in der Werkstatt", "danger", "werkstatt"];
  return ["frei", "success", "frei"];
}

/** "84 km/h, Bremen nach Hannover" für einen Lkw, der gerade gefahren wird. */
function fahrtText(t) {
  const m = t.leased_by && zustand.firma.members.find((x) => x.user_id === t.leased_by.user_id && x.online);
  const teile = [];
  if (t.speed_kmh != null) teile.push(Math.round(t.speed_kmh) + " km/h");
  const strecke = m && m.job ? streckeText(m.job.source_city, m.job.target_city) : "";
  if (strecke) teile.push(strecke);
  else if (t.near_city) teile.push("bei " + t.near_city);
  return teile.join(", ") || "wird gerade gefahren";
}

/** Kurz, wo ein Fahrer gerade ist. */
function unterwegsKurz(m) {
  if (!m.online) return m.last_seen != null ? "zuletzt " + wann(m.last_seen) : "noch nie im Spiel";
  const teile = [];
  if (m.plate) teile.push(m.plate);
  if (m.speed_kmh != null) teile.push(Math.round(m.speed_kmh) + " km/h");
  if (m.job) teile.push([m.job.cargo, streckeText(m.job.source_city, m.job.target_city)].filter(Boolean).join(", "));
  else if (m.near_city) teile.push("bei " + m.near_city);
  return teile.filter(Boolean).join(", ") || "im Spiel, kein Lkw";
}

/** Abgelehnte Ereignisse der letzten 7 Tage. */
const abgelehntWoche = () => zustand.abgelehnt.filter((e) => e.created_at >= Date.now() / 1000 - 7 * 86400);

/** Titel und Nebenzeile einer Buchung. */
function buchungText(e) {
  const istStorno = e.kind === "storno";
  const zusatz = [];
  if (e.cargo) zusatz.push(e.cargo);
  const strecke = streckeText(e.source_city, e.target_city);
  if (strecke) zusatz.push(strecke);
  if (e.distance_km != null) zusatz.push(km(e.distance_km));
  if (e.game_amount != null && e.game_amount !== e.amount && e.kind === "auftrag") zusatz.push("im Spiel " + euro(e.game_amount));
  if (e.note) zusatz.push(e.note);
  if (istStorno && e.booked_by_user) zusatz.push("von " + e.booked_by_user);
  // Als Lkw-Kauf verknüpfte Betriebskosten stehen mit dem aktuellen Kennzeichen da
  let art = e.truck_plate != null ? "Lkw-Kauf " + e.truck_plate : ARTEN[e.kind] || e.kind;
  if (istStorno) {
    // Art und Buchungszeit des Originals, dahinter Grund und wer storniert hat
    art = "Storno von " + (ARTEN_STORNO[e.reverses_kind] || e.reverses_kind || "Buchung");
    if (e.reverses_created_at != null) zusatz.unshift("gebucht " + wann(e.reverses_created_at));
  }
  const unter = [e.user, ...zusatz].filter(Boolean).join(", ");
  return { art, unter, voll: [art, e.user ? ", " + e.user : "", zusatz.length ? " (" + zusatz.join(", ") + ")" : ""].join(""),
           symbol: e.truck_plate != null ? "lkw" : ARTEN_SYM[e.kind] || "kassenbuch" };
}

/** Meldung nach einer Rückgabe: Schaden, Haftung und ob der Lkw jetzt in der Werkstatt steht. */
function nachRueckgabe(t, r, anfang) {
  let text = anfang + " Schaden " + prozent(r.damage) + ".";
  if (r.liability > 0) {
    const wer = r.liability_user_id === zustand.ich.user_id ? "deinem Lohnkonto"
      : "dem Lohnkonto von " + ((t.leased_by && t.leased_by.name) || "dem Fahrer");
    text += " Haftung für " + zehntel(r.damage_new) + " Prozentpunkte neuen Schaden: " + euro(r.liability) + " von " + wer + ".";
  }
  if (r.in_workshop) text += " Das ist über der Grenze von " + prozent(r.damage_limit) + ", der Lkw steht jetzt in der Werkstatt.";
  melde(text);
}

/** Zeitraum mit Schnellwahl, Datumsfeldern und Art. */
function baueFilterleiste() {
  const f = zustand.filter;
  const von = h("input", { type: "date", value: f.von });
  const bis = h("input", { type: "date", value: f.bis });
  const setze = (v, b) => {
    zustand.filter.von = v; zustand.filter.bis = b;
    von.value = v; bis.value = b;
    zeichneSchnellwahl();
    versuche(() => auffrischen(false));
  };
  von.addEventListener("change", () => setze(von.value, bis.value));
  bis.addEventListener("change", () => setze(von.value, bis.value));
  const art = h("select", {}, h("option", { value: "" }, "Alle Arten"),
    Object.entries(ARTEN).map(([k, v]) => h("option", { value: k }, v)),
    h("option", { value: "lohnabrechnung" }, "Lohnabrechnung"), h("option", { value: "erlass" }, "Erlassener Lohn"));
  art.value = f.art;
  art.addEventListener("change", () => { zustand.filter.art = art.value; ZEICHNER.kassenbuch(true); });
  const schnell = [["heute", "Heute", () => [lokalerTag(0), lokalerTag(0)]], ["7", "7 Tage", () => [lokalerTag(-6), ""]],
                   ["30", "30 Tage", () => [lokalerTag(-29), ""]], ["alle", "Alle", () => ["", ""]]];
  return h("section", { class: "karte filterleiste", "aria-label": "Filter" },
    h("div", { class: "schnellwahl", id: "kb-schnell", role: "group", "aria-label": "Zeitraum schnell wählen" },
      schnell.map(([k, text, bereich]) => h("button", { type: "button", class: "pille", "data-wahl": k, "aria-pressed": "false",
        onclick: () => setze(...bereich()) }, text))),
    feld("Von (Tag)", von), feld("Bis (Tag)", bis), feld("Art", art, "art"));
}

function zeichneSchnellwahl() {
  const f = zustand.filter;
  const heute = lokalerTag(0);
  const aktiv = !f.von && !f.bis ? "alle" : f.von === heute && f.bis === heute ? "heute"
    : f.von === lokalerTag(-6) && !f.bis ? "7" : f.von === lokalerTag(-29) && !f.bis ? "30" : null;
  document.querySelectorAll("#kb-schnell .pille").forEach((p) => p.setAttribute("aria-pressed", String(p.dataset.wahl === aktiv)));
}

/** Als Lkw-Kauf verknüpfen: Knopf an unverknüpften Betriebskosten, Lösen an verknüpften (nur Chef). */
function kaufKnoepfe(e) {
  if (!istChef()) return null;
  const id = zustand.firmaId;
  if (e.truck_id != null) {
    return h("div", { class: "kauf" }, h("button", { type: "button", class: "btn leise klein", "data-k": "kauf-" + e.id, onclick: (ev) => versuche(async () => {
      await api("DELETE", "/api/companies/" + id + "/ledger/" + e.id + "/link-truck");
      await auffrischen();
      melde("Verknüpfung gelöst. Die Buchung steht wieder als Betriebskosten im Kassenbuch.");
    }, ev.currentTarget) }, "Verknüpfung lösen"));
  }
  if (e.kind !== "betriebskosten" || e.account !== "firma") return null;
  if (zustand.verknuepfen !== e.id) {
    return h("div", { class: "kauf" }, h("button", { type: "button", class: "btn leise klein", "data-k": "kauf-" + e.id,
      onclick: () => { zustand.verknuepfen = e.id; ZEICHNER.kassenbuch(true); const w = document.querySelector('[data-k="kaufwahl-' + e.id + '"]'); if (w) w.focus(); } },
      sym("lkw"), "Als Lkw-Kauf verknüpfen"));
  }
  const aktiv = aktiveLkw();
  const raus = zustand.lkw.filter((t) => t.retired);
  const zu = () => { zustand.verknuepfen = null; ZEICHNER.kassenbuch(true); };
  if (!zustand.lkw.length) {
    return h("div", { class: "kauf" }, h("span", { class: "hilfe" }, "Noch kein Lkw im Fuhrpark."),
      h("button", { type: "button", class: "btn leise klein", "data-k": "kaufwahl-" + e.id, onclick: zu }, "Abbrechen"));
  }

    aktiv.concat(raus).map((t) => h("option", { value: t.id }, t.plate + (t.retired ? " (nicht mehr im Fuhrpark)" : ""))));
  return h("div", { class: "kauf" }, wahl,
    h("button", { type: "button", class: "btn primaer klein", onclick: (ev) => versuche(async () => {
      const r = await api("POST", "/api/companies/" + id + "/ledger/" + e.id + "/link-truck", { truck_id: Number(wahl.value) });
      zustand.verknuepfen = null;
      await auffrischen();
      melde("Verknüpft. Im Kassenbuch steht jetzt Lkw-Kauf " + r.truck_plate + ".");
    }, ev.currentTarget) }, "Verknüpfen"),
    h("button", { type: "button", class: "btn leise klein", onclick: zu }, "Abbrechen"));
}

/** Die Zeilen des Kassenbuchs, mit Art-Filter. Setzt zustand.sichtbar für "Alle sichtbaren auswählen". */
function buchZeilen(chef) {
  const art = zustand.filter.art;
  // Buchungen einer Lohnabrechnung stehen nicht einzeln da, sondern als eine Zeile je Abrechnung.
  const einzeln = zustand.buch.entries.filter((e) => e.payroll_id == null && (!art || e.kind === art));
  const laeufe = !art || art === "lohnabrechnung" ? zustand.laeufe.filter((l) => l.lines.length) : [];
  const erlasse = !art || art === "erlass" ? zustand.erlasse : [];
  const posten = einzeln.map((e) => ({ t: e.created_at, id: e.id, e }))
    .concat(laeufe.map((l) => ({ t: l.created_at, id: Infinity, l })))
    .concat(erlasse.map((w) => ({ t: w.created_at, id: -w.id, w })))
    .sort((a, b) => b.t - a.t || b.id - a.id);
  // "Alle sichtbaren auswählen": stornierbar, ohne Betriebskosten (die korrigiert der Abgleich selbst)
  zustand.sichtbar = chef ? einzeln.filter((e) => e.reversible && e.kind !== "betriebskosten") : [];
  return posten.flatMap(({ e, l, w }) => {
    if (l) return laufZeilen(l, chef);
    // Erlassener Lohn: Es fließt kein Geld, nur die offene Forderung sinkt
    if (w) return [h("tr", {},
      chef ? h("td", { class: "wahl-zelle" }) : null,
      wannZelle(w.created_at),
      h("td", { class: "haupt" }, h("div", { class: "buchung" }, h("span", { class: "art-sym" }, sym("haken")),
        h("div", { class: "buchung-text" },
          h("div", { class: "buchung-titel" }, "Offener Lohn erlassen", plakette(euro(w.amount), "info")),
          h("div", { class: "buchung-unter" }, w.user + ", " + w.reason + ", von " + w.booked_by_user)))),
      h("td", { class: "zahl kasse" }), h("td", { class: "zahl lohn" }))];
    const weg = e.reversed_by != null;
    const istStorno = e.kind === "storno";
    const t = buchungText(e);
    const wahl = chef && e.reversible ? auswahlKasten(e.id, { amount: e.amount, account: e.account, kind: e.kind }, t.voll) : null;
    const grund = weg ? "Storniert am " + datum(e.reversed_at) + " " + uhrzeit(e.reversed_at) + (e.reverse_reason ? ": " + e.reverse_reason : "") : null;
    return [h("tr", { class: (weg ? "storniert" : istStorno ? "storno" : "") + (wahl && zustand.auswahl.has(e.id) ? " gewaehlt" : "") },
      chef ? h("td", { class: "wahl-zelle" }, wahl) : null,
      wannZelle(e.created_at),
      h("td", { class: "haupt" }, h("div", { class: "buchung" }, h("span", { class: "art-sym" }, sym(t.symbol)),
        h("div", { class: "buchung-text" },
          h("div", { class: "buchung-titel" }, h("span", { class: "durch" }, t.art),
            weg ? plakette("storniert", "neutral", grund) : null, istStorno ? plakette("Storno", "warning") : null),
          t.unter ? h("div", { class: "buchung-unter durch" }, t.unter) : null,
          weg ? stornoHinweis(e.reversed_at, e.reverse_reason, e.reversed_by_user) : null,
          weg ? null : kaufKnoepfe(e)))),
      betragZelle(e.account === "firma" ? e.amount : null, weg, "kasse"),
      betragZelle(e.account === "fahrer" ? e.amount : null, weg, "lohn"))];
  });
}

/** Zeichnet Kennzahlen, Ungeklärtes, Liste und Auswahl. Ohne `immer` nur, was sich geändert hat. */
ZEICHNER.kassenbuch = (immer) => {
  const chef = istChef();
  const f = zustand.filter;
  const ich = ichSelbst();
  const firma = zustand.firma;
  const kasse = zustand.buch.entries.filter((e) => e.account === "firma");
  const rein = kasse.filter((e) => e.amount > 0).reduce((s, e) => s + e.amount, 0);
  const raus = kasse.filter((e) => e.amount < 0).reduce((s, e) => s + e.amount, 0);
  const bereich = f.von || f.bis;
  zeichneSchnellwahl();
  zeichneTeil($("kb-kacheln"), JSON.stringify([firma.balance, firma.payroll_time, ich && [ich.wallet, ich.open_claim], rein, raus, bereich]), () => [
    kachel({ titel: "Firmenkasse", sym: "geld", ton: "primary", wert: euro(firma.balance), minus: firma.balance < 0,
      zusatz: "Abrechnung täglich um " + firma.payroll_time + " Uhr" }),
    ich ? kachel({ titel: "Dein Lohnkonto", sym: "lohn", ton: "success", wert: euro(ich.wallet), minus: ich.wallet < 0,
      zusatz: ich.open_claim ? "offener Lohn " + euro(ich.open_claim) : "kein offener Lohn" }) : null,
    kachel({ titel: bereich ? "Saldo im Zeitraum" : "Saldo", sym: "kassenbuch", ton: "info", wert: vzEuro(rein + raus), minus: rein + raus < 0,
      zusatz: "Einnahmen " + euro(rein) + ", Ausgaben " + euro(-raus) }),
  ]);
  zeichneTeil($("kb-ungeklaert"), JSON.stringify([chef, zustand.ungeklaert]), () => (chef ? baueUngeklaert() : null));

  const voll = zustand.buch.entries.length >= buchGrenze();
  zeichneTeil($("kb-hinweis"), JSON.stringify([f.von, f.bis, voll, chef]), () => [
    bereich ? h("p", { class: "tabelle-hinweis" }, "Gezeigt "
      + (f.von ? "ab " + tag(f.von) : "") + (f.von && f.bis ? " " : "") + (f.bis ? "bis einschließlich " + tag(f.bis) : "")
      + ". Kassenstand und Lohnkonto zählen immer alle Buchungen.") : null,
    voll ? h("p", { class: "tabelle-hinweis" }, "Gezeigt sind die neuesten " + buchGrenze() + " Buchungen. Für ältere den Zeitraum eingrenzen.") : null,
  ]);

  const box = $("kb-liste");
  const stand = JSON.stringify([zustand.buch, zustand.laeufe, zustand.erlasse, [...zustand.offen], f, chef, zustand.verknuepfen,
    zustand.lkw.map((t) => [t.id, t.plate, !!t.retired])]);
  if (immer) delete box.dataset.stand;
  zeichneTeil(box, stand, () => {
    const zeilen = buchZeilen(chef);
    if (!zeilen.length) {
      return leer("kassenbuch", f.art ? "Keine Buchungen dieser Art im gezeigten Zeitraum."
        : bereich ? "In diesem Zeitraum gibt es keine Buchungen." : "Noch keine Buchungen. Die erste kommt mit dem ersten abgelieferten Auftrag.");
    }
    let alle = null;
    if (chef) {
      alle = h("input", { type: "checkbox", "aria-label": "Alle sichtbaren auswählen", "data-k": "wahl-alle",
        title: "Alle sichtbaren auswählen. Betriebskosten bleiben draußen: Die korrigiert der Server, wenn du die Ereignisse dahinter stornierst.",
        onchange: (ev) => {
          for (const e of zustand.sichtbar) {
            if (ev.target.checked) zustand.auswahl.set(e.id, { amount: e.amount, account: e.account, kind: e.kind });
            else zustand.auswahl.delete(e.id);
          }
          ZEICHNER.kassenbuch(true);
        } });
      alle.disabled = !zustand.sichtbar.length;
    }
    return h("table", { class: "tabelle mittel kb-tabelle" + (chef ? " mit-wahl" : "") },
      h("thead", {}, h("tr", {}, chef ? h("th", { class: "wahl-zelle" }, alle) : null, h("th", {}, "Wann"), h("th", {}, "Buchung"),
        h("th", { class: "zahl" }, "Kasse"), h("th", { class: "zahl" }, "Lohnkonto"))),
      h("tbody", {}, zeilen));
  });
  zeichneAuswahl();
};

/** Schwebende Leiste unten, sobald Buchungen ausgewählt sind (nur Chef). */
function zeichneAuswahl() {
  const box = $("kb-auswahl");
  if (!box) return;
  const chef = istChef();
  const zahl = chef ? zustand.auswahl.size : 0;
  // Kästchen "Alle sichtbaren" im Tabellenkopf
  const alle = document.querySelector('[data-k="wahl-alle"]');
  if (alle) {
    const drin = zustand.sichtbar.filter((e) => zustand.auswahl.has(e.id)).length;
    alle.checked = drin > 0 && drin === zustand.sichtbar.length;
    alle.indeterminate = drin > 0 && drin < zustand.sichtbar.length;
  }
  const text = zahl === 1 ? "1 Buchung ausgewählt" : zahl + " Buchungen ausgewählt";
  const live = $("kb-live");
  if (live && live.textContent !== text && chef) live.textContent = text;
  box.hidden = !zahl;
  if (!zahl) { box.replaceChildren(); return; }
  const liste = [...zustand.auswahl.values()];
  const summe = (konto) => liste.filter((i) => i.account === konto).reduce((s, i) => s - i.amount, 0);
  ersetze(box,
    h("span", { class: "auswahl-zahl" }, text),
    h("span", { class: "auswahl-summe" }, "Storno: Kasse " + vzEuro(summe("firma")) + ", Lohnkonten " + vzEuro(summe("fahrer"))),
    h("button", { type: "button", class: "btn leise klein", "data-k": "auswahl-alle", disabled: !zustand.sichtbar.length,
      title: "„Alle sichtbaren“ lässt Betriebskosten aus: Die korrigiert der Server, wenn du die Ereignisse dahinter stornierst.",
      onclick: () => {
        for (const e of zustand.sichtbar) zustand.auswahl.set(e.id, { amount: e.amount, account: e.account, kind: e.kind });
        ZEICHNER.kassenbuch(true);
      } }, "Alle sichtbaren auswählen"),
    h("button", { type: "button", class: "btn leise klein", "data-k": "auswahl-leeren", onclick: () => { zustand.auswahl.clear(); ZEICHNER.kassenbuch(true); } }, "Auswahl leeren"),
    h("button", { type: "button", class: "btn gefahr klein", "data-k": "auswahl-storno", onclick: zeigeStorno }, sym("storno"), "Auswahl stornieren"));
}

/** Bestätigung mit Pflichtgrund, dann stornieren. */
function zeigeStorno() {
  const liste = [...zustand.auswahl.entries()];
  if (!liste.length) return;
  const summe = (konto) => liste.filter(([, i]) => i.account === konto).reduce((s, [, i]) => s - i.amount, 0);
  const kasse = summe("firma");
  const lohn = summe("fahrer");
  const kosten = liste.filter(([, i]) => i.kind === "betriebskosten").length;
  const grund = h("input", { required: true, minlength: 3, maxlength: 200, autocomplete: "off", "data-fokus": true });
  dialogFormular(liste.length === 1 ? "1 Buchung stornieren" : liste.length + " Buchungen stornieren", {
    text: ["Jede bekommt eine Buchung mit umgekehrtem Betrag. Die Buchungen selbst bleiben stehen und erscheinen durchgestrichen. Ein Storno lässt sich nicht zurücknehmen.",
      h("div", { class: "dlg-summe" },
        h("div", {}, h("span", { class: "hilfe" }, "Kasse"), h("strong", { class: kasse < 0 ? "minus" : kasse > 0 ? "plus" : "" }, vzEuro(kasse))),
        h("div", {}, h("span", { class: "hilfe" }, "Lohnkonten"), h("strong", { class: lohn < 0 ? "minus" : lohn > 0 ? "plus" : "" }, vzEuro(lohn)))),
      h("p", { class: "hilfe" }, "Überweisungen und Haftung werden mit der Gegenseite storniert, Lohn mit einer Gegenbuchung in der Kasse. "
        + "Liegt ein Ereignis in einem schon abgeglichenen Zeitraum, rechnet der Server den Geldabgleich neu und bucht zu viel gebuchte Betriebskosten zurück."),
      kosten ? h("div", { class: "hinweis warnung" }, sym("warnung"), h("span", {}, (kosten === 1 ? "Darunter ist eine Betriebskosten-Buchung" : "Darunter sind " + kosten + " Betriebskosten-Buchungen")
        + ". Ein Storno erlässt sie der Firma. Ist ein Teil schon korrigiert, etwa durch stornierte oder spät gemeldete Ereignisse, "
        + "gibt das Storno nur den Rest zurück und gleicht den korrigierten Teil mit einer Buchung aus.")) : null],
    felder: [feld("Grund", grund, { hilfe: "3 bis 200 Zeichen. Steht danach bei jeder stornierten Buchung." })],
    knopf: "Stornieren", gefahr: true,
    senden: async (d) => {
      const r = await api("POST", "/api/companies/" + zustand.firmaId + "/ledger/reverse",
        { entry_ids: liste.map(([id]) => id), reason: grund.value });
      d.zu();
      zustand.auswahl.clear();
      await auffrischen();
      if (zustand.ansicht === "kassenbuch") ZEICHNER.kassenbuch(true);
      melde(stornoMeldung(r));
    },
  });
}

/** Was nach einem Storno passiert ist, als Meldung. */
function stornoMeldung(r) {
  const n = r.entries.length;
  let text = (n === 1 ? "1 Storno gebucht" : n + " Stornos gebucht") + ". In der Kasse: " + euro(r.balance) + ".";
  const korr = r.drivers.flatMap((d) => d.corrections);
  if (korr.length) {
    const zurueck = korr.flatMap((c) => c.booked).reduce((s, b) => s + b.amount, 0);
    text += " Geldabgleich neu gerechnet" + (zurueck > 0 ? ", " + euro(zurueck) + " Betriebskosten zurück"
      : zurueck < 0 ? ", " + euro(-zurueck) + " Betriebskosten nachgebucht" : "") + ".";
  }
  const offen = r.drivers.reduce((s, d) => s + d.open_window, 0);
  if (offen) text += " " + (offen === 1 ? "1 Ereignis zählt" : offen + " Ereignisse zählen") + " beim nächsten Abgleich nicht mehr.";
  const erlassen = r.drivers.flatMap((d) => d.waived);
  const schon = erlassen.reduce((s, w) => s + (w.already_corrected || 0), 0);
  if (schon) text += " Von den Betriebskosten waren " + euro(schon) + " schon korrigiert, die gleicht eine Buchung aus.";
  const forderung = r.drivers.filter((d) => d.open_claim > 0);
  if (forderung.length) text += " Offener Lohn bleibt stehen: " + forderung.map((d) => d.user + " " + euro(d.open_claim)).join(", ")
    + ". Erlassen geht in der Liste der Fahrer.";
  return text;
}

/** Liste der abgelehnten Ereignisse im Büro. */
function zeichneAbgelehnt() {
  const liste = zustand.abgelehnt;
  zeichneTeil($("abgelehnt"), JSON.stringify(liste.map((e) => e.id)), () => !liste.length
    ? leer("haken", "Keine. Alles, was ankam, kam aus dem Firmenprofil oder es ist keins gemeldet.")
    : h("div", { class: "tabelle-rahmen" }, h("table", { class: "tabelle breit" },
        h("thead", {}, h("tr", {}, h("th", {}, "Zeit"), h("th", {}, "Fahrer"), h("th", {}, "Art"),
          h("th", { class: "zahl" }, "Betrag"), h("th", {}, "Profil"), h("th", {}, "Grund"))),

          h("td", { class: "zahl" }, euro(e.amount)),

/** Das offene Anschaffungsbudget mit Restbetrag. Ohne offenes Budget erscheint das Formular. */
function zeichneBudget() {
  const box = $("budget-stand");
  const form = $("budget-form");
  if (!box || !form) return;
  const b = zustand.firma.budget || null;
  form.hidden = !!b;
  zeichneTeil(box, JSON.stringify([b, zustand.firma.balance]), () => {
    if (!b) return h("div", { class: "hinweis" }, sym("info"), h("span", {}, "Gerade ist kein Budget offen. In der Kasse sind " + euro(zustand.firma.balance) + "."));
    const fuellung = h("span", { class: "fuellung" });
    fuellung.style.width = (b.amount ? Math.min(100, Math.max(0, (b.consumed / b.amount) * 100)) : 0) + "%";
    return h("div", { class: "budget-stand" },
      h("div", { class: "hilfe" }, "Offen seit " + wann(b.created_at) + (b.note ? ", " + b.note : "")),
      h("div", { class: "budget-wert" }, euro(b.rest)),
      h("span", { class: "balken warning", "aria-hidden": "true" }, fuellung),
      h("p", { class: "klein gedaempft" }, "übrig von " + euro(b.amount) + ". Als Betriebskosten gebucht: " + euro(b.consumed)
        + ". Beim Schließen wird nichts gebucht, der Rest kommt beim nächsten Abgleich nicht mehr in den Spielstand."),
      h("div", { class: "form-fuss" }, h("button", { type: "button", class: "btn sekundaer", "data-k": "budget-zu", onclick: (e) => versuche(async () => {
        const r = await api("POST", "/api/companies/" + zustand.firmaId + "/budgets/" + b.id + "/close", {});
        await auffrischen();
        melde("Budget geschlossen. Beim nächsten Abgleich entfallen die restlichen " + euro(r.budget.rest) + " im Spiel.");
      }, e.currentTarget) }, "Budget schließen")));
  });
}

function baueStufen() {
  const id = zustand.firmaId;
  let stufen = zustand.firma.wage_levels.map((w) => ({ ...w }));
  const box = h("div", {});
  const zahlfeld = (s, k, max, name) => h("input", { type: "number", min: 0, max, value: s[k], required: true,
    "aria-label": name, oninput: (e) => { s[k] = Number(e.target.value); } });
  const zeichne = () => box.replaceChildren(
    h("div", { class: "tabelle-rahmen" }, h("table", { class: "tabelle stufen mittel" },
      h("thead", {}, h("tr", {}, h("th", {}, "Stufe"), h("th", {}, "ab Level"), h("th", {}, "ab Firmen-km"), h("th", {}, "Cent je km"), h("th", { class: "eng" }, h("span", { class: "sr" }, "Aktion")))),
      h("tbody", {}, stufen.map((s, i) => h("tr", {},
        h("td", {}, "Stufe " + (i + 1)),
        h("td", {}, zahlfeld(s, "min_level", 1000, "Stufe " + (i + 1) + ", ab Level")),
        h("td", {}, zahlfeld(s, "min_km", 100000000, "Stufe " + (i + 1) + ", ab Firmen-km")),
        h("td", {}, zahlfeld(s, "cents_per_km", 100000, "Stufe " + (i + 1) + ", Cent je km")),
        h("td", { class: "eng" }, stufen.length > 1 ? h("button", { type: "button", class: "btn leise klein", "aria-label": "Stufe " + (i + 1) + " entfernen",
          onclick: () => { stufen.splice(i, 1); zeichne(); } }, "Entfernen") : null)))))),
    h("div", { class: "form-fuss", style: "padding: 0 var(--sp-5) var(--sp-5)" },
      h("button", { type: "button", class: "btn sekundaer links", onclick: () => {
        const letzte = stufen[stufen.length - 1];
        stufen.push({ min_level: letzte.min_level, min_km: letzte.min_km, cents_per_km: letzte.cents_per_km });
        zeichne();
      } }, sym("plus"), "Stufe hinzufügen"),
      h("button", { class: "btn primaer" }, "Lohnstufen speichern")));
  zeichne();
  return karte("Lohnstufen", formular(async () => {
      const r = await api("PUT", "/api/companies/" + id + "/wage-levels", {
        levels: stufen.map((s) => ({ min_level: s.min_level, min_km: s.min_km, cents_per_km: s.cents_per_km })) });
      stufen = r.wage_levels.map((w) => ({ ...w }));
      zeichne();
      await auffrischen();
      melde("Lohnstufen gespeichert. Sie gelten ab der nächsten Abrechnung.");
    }, box),
    { klasse: "ganz tabelle-karte", text: "Ein Fahrer hat die letzte Stufe in der Liste, bei der er beide Bedingungen erfüllt: Level im Spiel und Kilometer für die Firma." });
}

// ---------------------------------------------------------------- Testbereich: buchen von Hand, ohne Spiel

/** Vorschläge für das Kennzeichen im Testbereich: die Lkw des Fuhrparks, deiner zuerst. */
function fuelleKennzeichen() {
  const liste = $("kennzeichen");
  if (!liste) return;
  const meine = zustand.lkw.filter((t) => t.leased_by && t.leased_by.user_id === zustand.ich.user_id);
  const rest = zustand.lkw.filter((t) => !meine.includes(t) && !t.retired);
  const neu = JSON.stringify(meine.concat(rest).map((t) => t.plate));
  if (liste.dataset.stand === neu) return;
  liste.replaceChildren(...meine.concat(rest).map((t) => h("option", { value: t.plate })));
  liste.dataset.stand = neu;
  const feldKz = $("herzschlag-kz");
  if (feldKz && !feldKz.value && meine.length) {
    feldKz.value = meine[0].plate;
    modellZumKennzeichen();
  }
}

/** Im Testbereich: das Modell des Lkw mit dem eingetragenen Kennzeichen, wie es das Plugin meldet. */
function modellZumKennzeichen() {
  const kz = $("herzschlag-kz"), modell = $("herzschlag-modell");
  if (!kz || !modell) return;
  const t = zustand.lkw.find((x) => !x.retired && x.plate.toUpperCase() === kz.value.trim().toUpperCase());
  if (t) modell.value = t.model;
}

/** Das Profil, mit dem der Testbereich bucht. */
function zeichneMeinProfil() {
  const p = meinProfil();
  const text = p ? "Gebucht wird wie aus deinem Firmenprofil " + p + "." : "Du hast kein Firmenprofil gemeldet, der Server bucht deshalb ohne Prüfung des Profils.";
  document.querySelectorAll(".mein-profil").forEach((box) => { if (box.textContent !== text) box.textContent = text; });
}

// ---------------------------------------------------------------- Start

async function start() {
  if (!zustand.token) return zeigeAnmeldung(false);
  try {
    zustand.ich = await api("GET", "/api/me");
  } catch (e) {
    if (e.status === 401) { speicher.set("token", null); zustand.token = null; return zeigeAnmeldung(false); }
    zeigeAussen(h("div", { class: "karte anmelde-karte" }, leer("warnung", e.message)));
    return;
  }
  const gemerkt = Number(speicher.get("firma"));
  if (gemerkt && zustand.ich.companies.some((f) => f.id === gemerkt)) return oeffneFirma(gemerkt);
  if (zustand.ich.companies.length === 1) return oeffneFirma(zustand.ich.companies[0].id);
  return zeigeFirmenwahl();
}

versuche(start);
