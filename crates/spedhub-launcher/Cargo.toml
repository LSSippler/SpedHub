[package]
name = "spedhub-launcher"
version.workspace = true
edition.workspace = true
description = "Launcher für SpedHub: Anmelden, Fuhrpark, Lkw in den Spielstand schreiben, Spiel starten"

[lib]
name = "spedhub_launcher"
path = "src/lib.rs"

[[bin]]
name = "spedhub-launcher"
path = "src/main.rs"

[dependencies]
spedhub-save = { path = "../spedhub-save" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Derselbe HTTP-Client wie im Plugin
ureq = { version = "~3.4.3", default-features = false, features = ["rustls", "json"] }
# Oberfläche. Nur glow (OpenGL), ohne wgpu. x11 braucht es nur, damit es auch unter Linux baut.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11"] }
# Prüfsummen für Plugin-Stand und Update. Wie im Server, MIT oder Apache-2.0.
sha2 = "0.11.1"

[target.'cfg(windows)'.dependencies]
# DPAPI, Dokumente-Ordner, Prozessliste, Steam-Link öffnen, Steam in der Registry,
# MessageBox, Ordnerdialog, Neustart mit Adminrechten
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
spedhub-server = { path = "../../server" }
spedhub-plugin = { path = "../spedhub-plugin" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }
axum = "0.8.9"
